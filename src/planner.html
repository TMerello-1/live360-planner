 and practical defenses, including identity verification, information leakage, and manipulation tactics. Attendees leave with policies, training, and tools to strengthen this frontline.","learn":"Why service desk roles carry elevated risk ; Identity verification best practices and pitfalls ; How casual conversations and shortcuts leak sensitive data ; Mitigation through policy, training, and tools","level":"Introductory to Intermediate","track":"Threat Intelligence & Human Risk"},"18:l360-keynote-ai-on-air":{"summary":"Tim Huckaby presents a demo-heavy keynote on building a real-time, interactive AI avatar for live broadcast TV. He covers the technical wins and failures, plus the trust, disclosure, and governance questions that arise when AI becomes a public personality.","learn":"Lessons for low-latency real-time AI interactions ; Architectural pitfalls and surprises from taking an avatar to production ; Why audiences attribute human traits to lifelike avatars ; Governance needs for disclosure, consent, and accountability with synthetic personalities","level":"Everyone","track":"Keynotes, General Sessions & Panels, Agents & AI Engineering"},"18:VSW09":{"summary":"This session explains how Angular Signal Forms use signals and a strongly typed model to simplify form building, state tracking, and input validation. Speaker Deborah Kurata covers conditional, pattern, and custom validation, and shows how this approach keeps forms easier to maintain.","learn":"Core architecture of Signal Forms and how signals manage form state ; Conditional and custom validation techniques ; Displaying and managing validation errors effectively","level":"Introductory to Intermediate","track":"Full Stack Web Development"},"18:VSW10":{"summary":"This session walks attendees through serverless design patterns using live demos rather than just theory. It offers practical methods for handling async work and errors, aimed at both experienced architects and newcomers. The goal is to help attendees build scalable, budget-friendly cloud applications.","learn":"Watch serverless patterns operate in live demos ; Apply proven tactics to real projects right away ; Handle asynchronous challenges and error management ; Refine architecture skills for resilient cloud apps","level":"Intermediate","track":"Cloud, Containers & Microservices"},"18:VSW11":{"summary":"Ken Muse and Mickey Gousset, both GitHub staff DevOps architects, walk through real-world AI failures, from bad deployments to rogue chatbots and agents that leak data. They analyze the root causes, show what should have been done instead, and offer guardrails and a framework for spotting AI risks.","learn":"Root causes behind real AI failures ; Guardrails for responsible AI in development workflows ; Framework for identifying AI risk patterns in your projects","level":"Introductory to Intermediate","track":"Modern Software Engineering"},"18:VSW12":{"summary":"A session for teams without a dedicated designer, or still learning AI, shows how tools like Claude, ChatGPT, and Figma can turn visual ideas into working app interfaces. It covers design-to-code workflows using MCP servers, reusable design systems, and standard components for consistent enterprise apps.","learn":"AI-assisted design-to-code workflows ; Using MCP servers and Agent Skills ; Building reusable design systems ; Standardizing components for enterprise apps at scale","level":"Intermediate","track":"Developing New Experiences"},"18:DPW05":{"summary":"This session explores how AI can assist with Power BI and data visualization work without replacing human design decisions. Meagan Longoria examines when AI tools succeed or struggle, and where human judgment still matters. Attendees get a practical framework for deciding when to rely on AI and when to take control.","learn":"Spot where AI can handle report and chart generation well ; Recognize where human judgment still drives results ; Use AI to improve design choices, not just speed up visuals ; Apply a framework for when to lean on AI","level":"Introductory","track":"AI for BI"},"18:DPW06":{"summary":"This session introduces Git and GitHub basics for storing code, including repositories, branches, and commits, along with team collaboration. It then shows how to build GitHub Actions workflows that automate code, cloud, and database deployments, and how to apply CI/CD practices for more reliable releases.","learn":"Manage code with repositories, branches, and commits ; Collaborate effectively in shared repos ; Build GitHub Actions workflows for automated deployments ; Apply CI/CD practices to improve release reliability","level":"Intermediate","track":"Database Development"},"18:TMW07":{"summary":"The session covers both versions of Windows Autopilot, the original v1 and the newer v2 known as Device Preparation, which together widen the scenarios to consider. Michael Niehaus will walk through the full set of scenarios, how to configure them, and techniques for addressing gaps that aren't supported directly.","learn":"Understand available Autopilot scenarios and their limits ; Learn how to set up Autopilot scenarios ; Discover workarounds for existing limitations","level":"Advanced","track":"Client and Endpoint Management"},"18:TMW08":{"summary":"This session shows how the pwshSpectreConsole module can take PowerShell 7 scripts beyond plain text output. Attendees see examples of styled formatting, richer user interaction, and image display. It also covers building reusable functions and cross-platform tools.","learn":"Use pwshSpectreConsole in console work ; Build functions that leverage the module ; Create visually engaging cross-platform PowerShell tools","level":"Intermediate to Advanced","track":"PowerShell, Automation & DevOps"},"18:TMW09":{"summary":"This one-hour session by Alex de Jong explains Microsoft Purview, a suite of data governance tools, in plain terms. It covers finding hidden data, classifying sensitive information, and applying data loss prevention at scale, with live demos and practical takeaways.","learn":"Classifying data in Purview ; Managing the data lifecycle ; Securing data","level":"Intermediate","track":"Security for IT Professionals"},"18:AIW05":{"summary":"This session shows how to run AI securely across Microsoft 365 Copilot, Copilot Studio, agent platforms, Foundry, and Fabric. It covers governance models, identity and access strategies, Zero Trust principles, and policy controls. It also addresses monitoring, auditing, and observability for AI at scale.","learn":"Design governed AI architectures across Microsoft 365, Copilot Studio, Foundry, and Fabric ; Apply Zero Trust, identity, and policy controls to Copilot and agents ; Monitor, audit, and observe enterprise AI operations at scale","level":"Intermediate to Advanced","track":"AI App Patterns"},"18:AIW06":{"summary":"Kayla Cinnamon's session shows how to make Copilot act like a teammate who knows your codebase, using instruction files, prompts, reusable skills, and custom agents in VS Code and the CLI. It also covers guardrails for commands Copilot can run and a mental model for choosing between instructions, skills, and agents.","learn":"Purpose of agent skills and how to build your own ; Differences between agent instructions, skills, and custom agents ; Applying all three to a custom workflow","level":"Intermediate to Advanced","track":"Copilot & Developer Workflows"},"18:EAW03":{"summary":"This session explains how Microsoft Foundry and Microsoft Foundry Tools (formerly Azure AI Services) work together in production. It compares enterprise patterns such as document processing, knowledge retrieval, speech workflows, and governed generative AI, plus security, compliance, and cost considerations.","learn":"Select suitable AI services for enterprise use cases ; Design integration patterns that combine multiple AI services ; Apply security, compliance, and cost governance to AI systems","level":"Introductory to Intermediate","track":"AI Enterprise Architecture"},"18:CRW05":{"summary":"This session shows how to use Microsoft Purview Data Loss Prevention with Edge for Business to enforce real-time controls when users try to share sensitive data from the browser. It covers managed, unmanaged, and GenAI apps, plus browser features like protected clipboard, watermarking, extension governance, and unified policy management that strengthen DLP.","learn":"Configure real-time DLP in Edge across managed, unmanaged, and GenAI apps ; Use protected clipboard, watermarking, and extension governance alongside DLP ; Manage policies in one place through the Edge admin portal ; Fit browser-based DLP into a broader data security strategy","level":"Intermediate","track":"Purple Team"},"18:CRW06":{"summary":"Microsoft MVP Tatu Seppälä shares lessons from many Purview Information Protection and DLP deployments across industries. The session covers preparation, label and policy design, tenant setup, encryption, naming, automation, and integrations with Fabric and Power BI. It aims to help architects avoid real-world pitfalls and curb risky behavior without disrupting work.","learn":"Avoid common real-world Purview deployment pitfalls ; Complete tenant-level preparations and integration requirements early ; Build data-driven controls that deter risky actions without disrupting workflows","level":"Intermediate to Advanced","track":"AI in Cybersecurity: Attack, Defense, & Governance"},"18:VSW13":{"summary":"This introductory session covers Blazor, a framework that lets developers build web apps with C# and .NET. Attendees will learn its core concepts, how it runs code in the browser or on the server, and how it compares with Angular, React, and Vue.","learn":"Blazor basics and building a modern Blazor web app ; Combining client-side and server-side hosting in one app ; When to choose Blazor over Angular, React, or Vue","level":"Introductory","track":"Full Stack Web Development"},"18:VSW14":{"summary":"This session shows how to build a cloud platform on Azure that makes applications easy to monitor and operate. It covers Azure's built-in monitoring services, how to design monitoring setups for multiple applications and business domains, and how to collect telemetry from Azure and cloud-native apps using OpenTelemetry.","learn":"Azure's built-in observability and monitoring capabilities ; Designing monitoring topologies for Azure-hosted applications ; Collecting telemetry from Azure and cloud-native apps with OpenTelemetry ; Combining telemetry signals into an observable backplane","level":"Intermediate to Advanced","track":"Cloud, Containers & Microservices"},"18:VSW15":{"summary":"This session shows .NET developers how to build cross-platform apps with .NET MAUI, Uno Platform, and Blazor Hybrid. It explains how to share code and components between web and native mobile or desktop apps, and how to bring existing JavaScript frameworks into native apps through hybrid WebViews.","learn":"Compare web and native .NET development stacks ; Find ways to share code across platforms ; Review tools for bringing web experiences to native apps","level":"Introductory","track":"Developing New Experiences"},"18:VSW16":{"summary":"This session walks developers through lesser-known SQL Server 2025 and Azure SQL Database features, including native JSON handling, vector data for AI-powered search, zero-ETL replication to Microsoft Fabric, and ledger tables for tamper-evident data. Demos also note which features need specific versions and which work on-premises.","learn":"Handle JSON, XML, and vector data in SQL for speed and simpler development ; Add tamperproof, graph, and document capabilities without another service ; Some Azure-branded features also run on-premises or connect to on-prem SQL Server","level":"Introductory","track":"Data & Analytics"},"18:DPW07":{"summary":"This session teaches Power BI developers the key principles of accessible report design and shows how AI can help, both as a live assistant during development and through automated agentic workflows. It aims to make accessibility practical rather than a low-priority chore.","learn":"Core accessible design principles for report developers ; Using AI as a real-time assistant while building reports ; Agentic workflows that automate accessibility tasks ; AI support for accessible design in human-led development","level":"Introductory to Intermediate","track":"AI for BI"},"18:DPW08":{"summary":"This session covers database concurrency basics and how locking differs from blocking. Attendees will learn to spot when concurrency problems occur and practical steps to fix related performance issues.","learn":"Grasp core concurrency concepts ; Recognize when blocking is occurring ; Resolve blocking, locking, and deadlock issues","level":"Intermediate","track":"Database Platforms, Tuning, and Administration"},"18:TMW10":{"summary":"This session explains why teams should move from Windows PowerShell 5.1 to PowerShell 7.6, which has gained major improvements since 5.1 launched. It covers what's new in 7.6, the key differences between the two versions, and practical approaches for making the switch.","learn":"PowerShell 7 enhancements ; Differences between PowerShell 5.1 and 7 ; Approaches for making the migration","level":"Intermediate","track":"PowerShell, Automation & DevOps"},"18:TMW11":{"summary":"This session shows how SOC teams can combine Microsoft Defender XDR, Microsoft Sentinel, and Security Copilot into one AI-assisted security operations platform. It focuses on practical architecture, workflows, and use cases for faster detection, investigation, and response with fewer analysts.","learn":"Understand how Defender XDR and Sentinel together cover detection, investigation, and response across identities, endpoints, email, and cloud ; See how Security Copilot speeds triage and analyst decisions with generative AI ; Plan SOC modernization through tool consolidation, automation, and AI-assisted workflows","level":"Intermediate","track":"AI for IT Professionals"},"18:TMW12":{"summary":"AI is speeding up cyberattacks, so defenders need systems that continuously sense, analyze, and respond instead of just producing more alerts. This session covers Microsoft's Project Perception and how its specialized red, blue, and green agents, working with Defender, Sentinel, Entra, and Purview, can find attack paths and fix risks while keeping humans in control.","learn":"Why machine-speed attacks need a continuous sense-think-act loop ; Mapping Defender, Sentinel, Entra, and Purview to signals, context, and enforcement ; How red, blue, and green agents handle attack-path discovery, investigation, and remediation ; Where humans should stay in control of autonomous defense","level":"Intermediate","track":"Security for IT Professionals"},"18:AIW07":{"summary":"This hands-on session shows how GitHub Copilot in Visual Studio Code can make everyday coding feel more fluid and less tedious. Attendees will see how plain-language prompts can help generate code, refactor, and write documentation. The goal is to cut repetitive work so developers can focus on meaningful solutions.","learn":"Configure Copilot in VS Code ; Apply Copilot to generating, refactoring, and documenting code ; Reduce repetitive work to stay focused","level":"Introductory","track":"Copilot & Developer Workflows"},"18:AIW08":{"summary":"Jon Galloway's intermediate session shows how to add practical AI features to .NET applications, such as summarization, classification, and semantic search, using Microsoft.Extensions.AI with cloud or local models. It then introduces agentic development with the Microsoft Agent Framework, covering tools and workflows that let applications reason, plan, and act.","learn":"Add AI features incrementally to existing .NET apps ; Use Microsoft.Extensions.AI for cloud and local models ; Apply summarization, classification, and semantic search ; Build agents that use tools and workflows with Microsoft Agent Framework","level":"Intermediate","track":"Agents & AI Engineering"},"18:EAW04":{"summary":"This session explains why many enterprise AI projects fail to move from pilot to production, drawing on doctoral research and banking experience. It presents architecture patterns such as tiered AI strategies to control costs, RAG designs for regulated settings, and evaluation methods that make AI outputs reliable enough for production decisions.","learn":"Organizational capabilities that determine whether AI pilots reach production ; Tiered integration designs that balance cost, latency, and accuracy ; Governance and evaluation frameworks for AI decisions in regulated industries","level":"Intermediate","track":"AI Enterprise Architecture"},"18:CRW07":{"summary":"This session covers how businesses can protect themselves from devices they cannot monitor or control. It identifies the user groups that work from unmanaged devices and examines combined solutions such as MAM for Windows, session policies, and device-bound passkeys. Attendees learn to choose approaches that reduce data leakage and unauthorized access risks.","learn":"Choose a protection method that fits your business and users ; Explore MAM for Windows, session policies, MTD connectors, and Edge for Business ; Apply in-browser protection and device-bound passkeys ; Understand the risks of unmanaged devices in 2026","level":"Intermediate","track":"Blue Team"},"18:CRW08":{"summary":"This session covers insider threat risks that appear when employees resign, are terminated, or change roles, a stage often under-protected. Tatu Seppälä will demonstrate data-driven controls using Microsoft Purview, Entra ID, and Defender, along with investigation tips and gaps in the current Microsoft stack.","learn":"Insider threat patterns that emerge during workforce transitions ; Microsoft-based technical measures against common transition risks ; Capability gaps not fully addressed out-of-the-box","level":"Intermediate to Advanced","track":"Purple Team"},"19:VSH01":{"summary":"This session shows how Uno Platform lets developers target mobile, web, and desktop from one shared .NET codebase. It also covers AI-assisted design tools and agentic workflows that help build and validate UI.","learn":"Grasp the core value of Uno Platform ; Survey its platform reach and coding patterns ; Apply AI and design tooling through agentic workflows","level":"Intermediate","track":"Developing New Experiences"},"19:VSH02":{"summary":"Amber Vanderburg's 2026 session shows leaders how to pair human judgment with AI to decide better and lead teams. Attendees practice using AI for difficult conversations, summarizing information, clearer messaging, and scenario planning, with simple prompts. The session also covers AI's limits and how to lead adoption within a team.","learn":"Weigh AI's benefits and drawbacks for leaders ; Build everyday AI skills for common leadership tasks ; Guide AI adoption confidently within your team","level":"Intermediate to Advanced","track":"Human Factors in Engineering"},"19:VSH03":{"summary":"This session examines applying AI across the entire software development lifecycle, not just coding. It explores how AI can reduce tedious work in meetings, requirements, and testing so teams can focus on building good software and ensuring quality.","learn":"Drawbacks of limiting AI adoption to coding ; Ways AI can support every stage of the SDLC ; Treating AI as a way to increase impact, not just speed","level":"Intermediate","track":"Modern Software Engineering"},"19:VSH04":{"summary":"Jim Wooley explores how the .NET compiler platform, Roslyn, enables capabilities beyond new language syntax. The session covers runtime C# scripting for dynamic behavior, building analyzers and fixes for code smells, and using syntax generators to automate repetitive code.","learn":"Add runtime behavior with C# Scripting ; Build and use code analyzers with code fixes ; Automate repetitive code with Syntax Generators","level":"Intermediate","track":"The Core of .NET"},"19:DPH01":{"summary":"This session introduces Model Context Protocol (MCP) servers and how they can speed up Power BI work with AI assistance, such as generating semantic models, writing DAX, and setting up role-level security. Attendees will install and configure Fabric and Power BI MCP servers, connect through VS Code, and review data security risks and best practices.","learn":"Core MCP server concepts and their role in AI-assisted Power BI development ; Installing, configuring, and connecting to an MCP server in VS Code ; Data security risks of MCP-enabled AI and ways to use MCP safely","level":"Introductory to Intermediate","track":"AI and Context"},"19:DPH02":{"summary":"This session explains error handling in Microsoft Fabric Data Pipelines, clarifying the differences between the four activity outcome paths (success, error, completion, skip) and when to use each. It also covers logging, retry logic, reusing logic, and comparing user-defined functions with sub-pipelines.","learn":"Conditional logic in Fabric Data Pipelines ; Implementing retry logic effectively ; UDFs vs. sub-pipelines for logging and error capture","level":"Intermediate","track":"Data Engineering and Data Management"},"19:TMH01":{"summary":"An eight-hour workshop for IT professionals on using Microsoft Copilot to boost productivity, collaboration, and workflows, with live demos and real-world scenarios. Attendees also get an adoption playbook covering rollout, governance, and ROI metrics.","learn":"Hands-on Copilot skills across Microsoft 365 ; Writing prompts that produce useful output ; Identifying where Copilot saves real time and where it isn't worth it yet ; Building a rollout strategy and proving ROI for governance","level":"Introductory to Intermediate","track":"AI for IT Professionals"},"19:TMH02":{"summary":"In this hands-on 75-minute session, Mike O'Neill shows how to turn simple PowerShell scripts into reusable functions and then into advanced functions with more control. Attendees also learn to add built-in help and package the code as a versioned custom module for easy deployment.","learn":"Build reusable functions with consistent output ; Upgrade to advanced functions with validation and pipeline input ; Add comment-based help so Get-Help works ; Package, version, and deploy a custom module","level":"Intermediate to Advanced","track":"PowerShell, Automation & DevOps"},"19:TMH03":{"summary":"This session examines Active Directory Certificate Services (AD CS) misconfigurations that can let attackers take over a whole domain quickly. It challenges the assumption that certificates are inherently safer than passwords, then covers mitigating privilege escalation and auditing settings with community tools.","learn":"Spotting frequent AD CS configuration errors ; Reducing privilege escalation risks ; Auditing and monitoring AD CS security settings with community tools","level":"Intermediate","track":"Security for IT Professionals"},"19:AIH01":{"summary":"This session shows how to tailor GitHub Copilot and similar AI coding tools so they follow a team's architecture and standards and handle real tasks with less supervision. It covers building specialized coding agents, extending capabilities with MCP servers and skills, customizing auditing, and crafting agentic workflows for Continuous AI.","learn":"Create specialized coding agents matched to your team's architecture and standards ; Extend Copilot with MCP servers, prompts, skills, and hooks ; Configure AI tooling to get better results in your development environment","level":"Introductory to Intermediate","track":"Copilot & Developer Workflows"},"19:AIH02":{"summary":"This session covers AgentOps, the operational discipline for keeping AI agents dependable, secure, and answerable once they run live business processes. It explores telemetry for agent actions, evaluation methods that track quality and drift, debugging multi-step failures, and identity management with Entra Agent ID and SPIFFE/SPIRE, drawing on multi-agent production experience.","learn":"Structure telemetry to record an agent's decision paths, tool invocations, and results ; Build evaluation pipelines that measure agent quality and catch drift over time ; Diagnose failures across multi-step agent executions with structured debugging workflows","level":"Intermediate to Advanced","track":"Agents & AI Engineering"},"19:EAH01":{"summary":"This session explores how virtue ethics combined with contextual integrity can guide AI decisions in complex organizations. Through modern case studies, attendees will examine AI's successes and pitfalls and learn how to shape ethical AI design.","learn":"Define virtue ethics and apply it to IT and AI ; Gather business context for technical challenges ; Apply ethical learnings to at least two IT or AI projects","level":"Introductory to Intermediate","track":"AI Enterprise Architecture"},"19:CRH01":{"summary":"This session shows how to replace a traditional VPN with Microsoft's Global Secure Access, so on-premises private apps work like cloud apps. It covers applying Entra ID Conditional Access, Access Packages, PIM, and Access Reviews to enforce least-privilege, identity-driven access. Attendees get hands-on guidance for a Zero Trust network strategy integrated with Entra governance.","learn":"Reach on-premises apps without VPN client software ; Apply Conditional Access and MFA to legacy private apps ; Automate private access lifecycles with Entitlement Management","level":"Advanced","track":"Blue Team"},"19:CRH02":{"summary":"This session shows small security teams how to automate the upkeep of Endpoint DLP controls. It covers silently monitoring file uploads against approved domains, using Logic Apps and the Graph API runHuntingQuery endpoint to collect audit events. Weekly findings are condensed into a Teams report so admins can update allowed domains quickly.","learn":"Configure audit-only Endpoint DLP rules and prerequisites ; Use Logic Apps to pull unauthorized upload events via Graph API hunting queries ; Turn weekly findings into a concise Teams report with CSV detail ; Explore GenAI enrichment with services like Azure OpenAI","level":"Advanced","track":"Threat Intelligence & Human Risk"},"19:VSH05":{"summary":"This intermediate talk by Chris Klug goes past basic Aspire introductions. It explains what Aspire does under the hood, how to adjust it when default settings fall short, and how to build custom extensions, such as new resources and commands, for projects the community doesn't yet support.","learn":"Core understanding of what Aspire is ; Tailoring Aspire to simplify your workflow ; Applying Aspire beyond simple scenarios ; Building custom resources and commands","level":"Intermediate","track":"Cloud, Containers & Microservices"},"19:VSH06":{"summary":"This session presents 10 patterns for making automated workflows reliable, resilient, and responsive, drawn from decades of workflow experience. It covers how guardrails change when AI is involved and shares practices architects use to keep workflows dependable at high request volumes. The patterns apply to any workflow engine or AI tool, for both agentic and non-agentic automation.","learn":"Value of workflow automation patterns ; Identifying which patterns fit a particular need ; Combining patterns to address real requirements","level":"Intermediate","track":"Human Factors in Engineering"},"19:VSH07":{"summary":"This session examines how the .NET developer's role is changing as AI takes on more coding work. Mark Michaelis compares current learning priorities with pre-AI ones and flags knowledge gaps to avoid. It offers practical guidance for engineers and leaders preparing for an AI-driven future.","learn":"Get the most out of AI while developing ; Spot and avoid common pitfalls of AI-assisted programming ; Apply SDLC fundamentals to agentic coding","level":"Introductory","track":"The Core of .NET"},"19:VSH08":{"summary":"Explains how to build test suites that are easy to maintain and fast to run using Microsoft Playwright services on Azure. Covers patterns like Page Objects and DRY/DAMP, plus scaling runs and wiring them into Azure DevOps or GitHub pipelines.","learn":"Writing maintainable Playwright tests ; Using Playwright cloud services to scale test runs ; Embedding cloud test runs in CI/CD deployment pipelines","level":"Intermediate","track":"Modern Software Engineering"},"19:DPH03":{"summary":"This session by Andrew Brust explains how to prepare Microsoft Fabric data so it works reliably across many AI tools, including copilots, agents, and external systems. It covers schema design, semantic models, ontologies, and using MCP to let outside agents access Fabric data securely.","learn":"Preparing data for AI use ; Value of semantic models and ontologies ; Getting the most from Fabric's AI tooling ; Secure access to Fabric data for outside agents","level":"Advanced","track":"AI and Context"},"19:DPH04":{"summary":"This session from Live! 360 Tech Con 2026 covers the newest high-performance Azure VM series for SQL Server and premium storage options such as Premium SSD v2 and Ultra Disk. Speaker David Pless also shows how Azure Monitor and the IO Analysis feature can help keep deployments running efficiently.","learn":"Choosing newer high-performance VM series for SQL Server workloads ; Provisioning Premium SSD, Premium SSD v2, and Ultra Disk storage ; Balancing price and performance for SQL VM and storage setups ; Tracking VM cached IOPS and bandwidth-consumed percentage to catch bottlenecks","level":"Intermediate to Advanced","track":"Database Platforms, Tuning, and Administration"},"19:TMH04":{"summary":"This session examines real organizations that used Microsoft Copilot, showing how cleaning and organizing data laid the groundwork and how change management drove team-wide adoption. Attendees will get key actions for a smoother Copilot rollout."," ations behind local-first development, compares hardware from NVIDIA, Apple, AMD, and Windows on ARM, and shows how to host and integrate models into .NET workflows, including when a hybrid approach fits better.","learn":"Assessing whether your organization's drivers justify local AI ; Comparing NVIDIA, Apple Silicon, AMD, and Windows on ARM for .NET workloads ; Hosting and integrating local models into .NET development workflows ; Recognizing when a hybrid setup beats going fully local","level":"Intermediate","track":"Agents & AI Engineering"},"19:EAH02":{"summary":"This session explains how to connect AI agents to existing enterprise systems using the Microsoft Agents Framework, Azure AI Foundry Agent Service, and Model Context Protocol. It covers tool-calling design, agent authentication, and the architectural choices that determine whether a project reaches production or stalls as a prototype.","learn":"Plan how agents connect to existing enterprise APIs and services ; Compare Microsoft Agents Framework, Foundry Agent Service, and custom orchestration ; Apply authentication and authorization patterns for agent-to-service calls","level":"Intermediate to Advanced","track":"AI Enterprise Architecture"},"19:CRH03":{"summary":"This Live! 360 demo session shows how to use Microsoft Entra ID Governance to automate onboarding, role changes, and offboarding. It covers Lifecycle Workflows, known limitations, and organizational prerequisites, with the goal of making sure departing staff lose access across hybrid environments. Attendees will watch a working setup built live.","learn":"Configure Entra ID Governance to automate onboarding, role transfers, and offboarding ; Assess the benefits and limitations of Microsoft's governance tools ; Prepare data and process foundations before enabling automation ; Verify that leavers lose access across the entire hybrid estate","level":"Advanced","track":"Blue Team"},"19:CRH04":{"summary":"This workshop explains how attackers compromise CI/CD pipelines, abuse trusted build identities, and inject malicious code into legitimate releases. It covers practical defenses, including scoped pipeline permissions, runner isolation, artifact integrity checks, and deployment guardrails that reduce blast radius.","learn":"Recognize how attackers compromise build pipelines and abuse CI identities ; Harden pipeline identities, permissions, runners, and deployment workflows ; Apply controls that limit blast radius and attacker movement","level":"Advanced","track":"AI in Cybersecurity: Attack, Defense, & Governance"},"19:vsl-panel-careers-in-the-age-of-ai":{"summary":"A Visual Studio Live! panel features practitioners, architects, and leaders discussing how AI is reshaping tech careers. They explore shifting skill values, changing expectations for junior and senior roles, and new approaches to hiring, mentorship, and internal mobility. Attendees will gain ideas for rethinking team design and talent strategy.","learn":"Which skills are gaining or losing value with AI ; How AI changes entry-level and senior role expectations ; Rethinking hiring, assessment, and mentorship ; Team composition and talent strategy for AI-era work","level":"Everyone","track":"-"},"19:dpl-panel":{"summary":"A panel moderated by Thomas LaRock, with Bradley Ball, Ginger Grant, and Buck Woody, examines how generative AI, copilots, and autonomous tools are reshaping data teams. It covers SQL development, BI reporting, data engineering, governance, and platform administration. Attendees will hear about career paths, team structures, hiring trends, and AI's impact over the next three to five years.","learn":"Which data tasks AI is likely to automate ; Skills gaining value as routine work shifts ; Where human expertise remains essential ; Emerging career paths and hiring trends","level":"Everyone","track":"-"},"19:tm-panel-will-ai-take-my-job":{"summary":"A candid TechMentor panel moderated by Dave Kawula explores the legal and liability risks of using AI at work. Speakers cover confidentiality, output ownership, hidden terms-of-service risks, and agentic AI security. A 2026 federal ruling on AI chat privilege serves as a case study.","learn":"Consumer AI chats may not be confidential ; Clarify who owns AI output and who bears liability ; Check AI terms of service for data, IP, and disclosure risks ; Agentic AI tools can be manipulated by malicious web content","level":"Everyone","track":"-"},"19:ail-panel":{"summary":"This panel examines why governance for AI agents lags behind their capabilities, especially around runaway resource use, identity-based and context-aware autonomy controls, and operational practices like testing, versioning, controlled deployment, and rollback. Speakers will also gather audience concerns about what enterprises need before trusting agents in production.","learn":"Persistent agents can run up token costs and overload data systems ; Autonomy controls based on identity and context are still immature ; Testing, versioning, and rollback practices are often missing ; Audience objections and real-world constraints shape what production trust requires","level":"Everyone","track":"-"},"19:aiea-panel":{"summary":"A panel moderated by Rockford Lhotka explores why AI pilots struggle to reach production and which architecture choices help. Speakers Tony Champion, Jocelynn Hartwig, Samantha St-Louis, and Sarah Wimberley cover cloud, platforms, agentic AI, governance, and ethics trade-offs.","learn":"Link architecture choices to business strategy and data trust ; Plan integration, security, and cost early ; Weigh trade-offs when moving prototypes to production ; Account for ethical risk and operational realities","level":"Intermediate","track":"AI Enterprise Architecture"},"19:cyber-panel-ai-security-arms-race":{"summary":"A panel moderated by Sami Laiho, with four industry experts, examines how AI helps both attackers and defenders. It also covers supply-chain risks from AI tools, cloud ate alerting with PowerShell and mine ring buffers and system_health","level":"Intermediate to Advanced","track":"Database Platforms, Tuning, and Administration"},"19:TMH07":{"summary":"A hands-on workshop where attendees build their own autonomous agent using Microsoft Copilot. It covers what separates agents from simple automation, how to design, test, and deploy them with tools like Copilot Studio, and common pitfalls to avoid.","learn":"Core concepts of Copilot and agents ; Working with Microsoft Copilot Studio ; Fundamentals of AI","level":"Intermediate","track":"AI for IT Professionals"},"19:TMH08":{"summary":"This 75-minute session offers a practical introduction to Microsoft Graph for admins and developers who want to automate Microsoft 365 tasks securely. It covers app registration, delegated versus application permissions, admin consent, and how workload roles limit what code can do.","learn":"Basics of using the Graph API ; Setting up an app registration in Entra ID ; Assigning RBAC roles so granted permissions actually work","level":"Intermediate to Advanced","track":"PowerShell, Automation & DevOps"},"19:TMH09":{"summary":"Maarten Goet traces ransomware from 1980s floppy-disk viruses through 2000s worms to today's Human-Operator Ransomware. He explains the ransomware economy, including access, affiliate models, negotiation, and payouts, using real case studies. He also offers defensive strategies and looks ahead to how threats may evolve.","learn":"Evolution of ransomware ; Current threats ; Defensive recommendations","level":"Advanced","track":"Security for IT Professionals"},"19:AIH05":{"summary":"This session walks through building a visual document helper on Azure that answers questions about invoices and forms, using it to examine architecture choices. Attendees will see which decisions most affect speed, expense, and dependability, plus how to bring safety checks and evaluation into existing cloud apps and avoid problems when moving multimodal features to production.","learn":"Practical architecture for vision-language apps ; Evaluating performance and reliability trade-offs ; Applying safety and evaluation practices ; Pitfalls when multimodal features leave the prototype stage","level":"Introductory to Intermediate","track":"Models & Evaluation"},"19:AIH06":{"summary":"This session argues that rapid AI-driven change matters less for its technology than for the people experiencing it. Drawing on DevOps experience and psychology, it examines how fear of irrelevance drives resistance, and how learning culture and growth mindset help. The focus is managing the transition, not becoming an AI expert.","learn":"Continuous tech change shapes human behavior ; Growth mindset helps when skills and roles keep shifting ; Fear, not technology, is the main barrier to change ; Learning culture is now essential","level":"Intermediate","track":"Agents & AI Engineering"},"19:EAH03":{"summary":"This session explains how enterprises can prepare for AI on Azure, covering governance with Azure AI Foundry and managed identity, keeping AI inside the security boundary, and the operational model needed before production use. Attendees get a framework for making durable Azure AI architecture decisions.","learn":"Assess governance options for securing production AI workloads, such as Foundry, managed identity, and private endpoints ; Design integrations that add AI to existing systems without creating shadow infrastructure or security gaps ; Build an operating framework for auditing, monitoring, and scaling Azure AI systems","level":"Introductory to Intermediate","track":"AI Enterprise Architecture"},"19:CRH05":{"summary":"This session covers how organizations manage, secure, and govern Copilot content and data, along with security weaknesses and how users work around ChatGPT and Copilot safeguards. Attendees will explore red teaming to protect AI-generated data, common ways AI gets attacked, and where to find current Copilot security em rather than hype ; Agent design involves separate decisions about reasoning, tools, state, and humans ; Latency, cost, security, and user trust shape whether an approach succeeds ; Plan for failure recovery and governance from the start","level":"Intermediate","track":"AI Enterprise Architecture"},"19:CRH07":{"summary":"This workshop covers how secrets exposure, risky third-party packages, and weak trust boundaries lead to cloud-native breaches. It shares practical ways to manage secrets, reduce dependency risk, and tighten boundaries without disrupting developer workflows.","learn":"Understanding how secrets exposure, dependency risk, and weak boundaries enable real cloud-native compromises ; Patterns for handling secrets and lowering package risk ; Ways to strengthen trust boundaries while preserving developer productivity","level":"Intermediate","track":"Blue Team"},"19:CRH08":{"summary":"This session shows attendees how to build their own classifiers in Microsoft Purview so the platform can recognize sensitive data in their environment. It compares several classifier approaches and explains how to choose the right one for each data type.","learn":"Purview classifier types and when to use them ; Building classifiers in Purview from scratch ; Choosing the right classifier for different sensitive data","level":"Intermediate","track":"Threat Intelligence & Human Risk"},"20:VSF01":{"summary":"A one-day hands-on masterclass led by Chris Klug on building large-scale business applications with ASP.NET Core. Topics include authentication, service communication, reverse proxying, Orleans, FastEndpoints, Docker, .NET Aspire, and automated testing.","learn":"Survey the tools available to ASP.NET Core developers ; See that ASP.NET Core offers much more than MVC and minimal APIs ; Discover lesser-known technologies worth exploring ; Simplify local multi-service development with Docker and .NET Aspire","level":"Introductory to Intermediate","track":"Full Stack Web Development, Workshops"},"20:VSF02":{"summary":"A full-day guided workshop led by Brian A. Randell covers building production-grade AI applications with C#, GitHub Copilot, and Microsoft Foundry. It spans AI fundamentals, security and compliance, RAG and agents, DevOps across GitHub and Azure DevOps, evaluations, observability, and Azure deployment.","learn":"AI architecture patterns such as RAG and agents ; Building security and compliance into AI apps from the start ; DevOps across GitHub and Azure DevOps with evaluations and observability ; Deploying production AI apps to Azure","level":"Intermediate to Advanced","track":"Modern Software Engineering, Workshops"},"20:DPF01":{"summary":"A one-day, hands-on workshop for experienced SQL Server professionals that maps existing skills to PostgreSQL, covering architecture, data types, T-SQL-to-PL/pgSQL translation, indexing, administration, and advanced features. It aims to show where the two platforms align and where they diverge for production work.","learn":"Compare PostgreSQL and SQL Server architecture and indexing ; Translate T-SQL procedures and data types to PL/pgSQL ; Perform core PostgreSQL DBA tasks such as backup, VACUUM, and monitoring ; Use JSONB, extensions, and foreign data wrappers","level":"Intermediate","track":"Database Development, Workshops, Full Day Hands-On Labs"},"20:TMF01":{"summary":"This hands-on workshop covers the fundamentals of building agents in Copilot Studio and the Agent Builder for M365 Copilot. Attendees gain practical experience with core concepts and learn to create AI agent experiences for users.","learn":"Latest features and approaches for building in Copilot Studio ; Practical tips and tricks for Copilot Studio ; How the Copilot Studio runtime works internally","level":"Intermediate","track":"AI for IT Professionals, Workshops"},"20:AIF01":{"summary":"This full-day workshop teaches attendees to build production-ready Model Context Protocol servers in .NET, moving from local debugging to };
const KIND_LABEL = { Session: "Session", "Fast Focus": "Fast Focus", Workshop: "Workshop", Lab: "Hands-On Lab", Keynote: "Keynote", Panel: "Panel", Event: "Event" };
const BASE = "https://live360events.com/events/orlando-2026/sessions/";

function toMin(t) {
  const m = t.trim().match(/^(\d{1,2}):(\d{2})(am|pm)$/i);
  let h = +m[1] % 12; if (m[3].toLowerCase() === "pm") h += 12;
  return h * 60 + +m[2];
}
function fmt(min) { return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); }
function durText(d) { const h = Math.floor(d / 60), m = d % 60; return (h ? h + " h" : "") + (h && m ? " " : "") + (m ? m + " min" : ""); }

const DAYS = [];
const SESSIONS = [];
(function parse() {
  let day = null;
  for (const line of RAW.split("\n")) {
    if (!line.trim()) continue;
    if (line.startsWith("#")) {
      const [num, en, short] = line.slice(1).split(" ");
      day = { num: +num, en, short, slug: en.toLowerCase() };
      DAYS.push(day); continue;
    }
    const [code, rawTitle, time, spk, slug, trackHint] = line.split("|");
    const [s, e] = time.split("-");
    let kind;
    if (/^(2-Day )?Hands-On Lab/i.test(rawTitle)) kind = "Lab";
    else if (/^(Hands-on )?Workshop:/i.test(rawTitle) || /^Hands-On Workshop:/i.test(rawTitle)) kind = "Workshop";
    else if (/^Fast Focus:/i.test(rawTitle)) kind = "Fast Focus";
    else if (/Keynote/i.test(rawTitle)) kind = "Keynote";
    else if (/Panel Discussion/i.test(rawTitle)) kind = "Panel";
    else if (code === "-") kind = "Event";
    else kind = "Session";
    const title = rawTitle.replace(/^(2-Day )?Hands-On Lab:\s*/i, m => m.startsWith("2-Day") ? "2-Tage-Lab: " : "")
      .replace(/^(Hands-on )?Workshop:\s*/i, "").replace(/^Fast Focus:\s*/i, "");
    const track = code === "-" ? (trackHint || "L3") : code.slice(0, 2);
    const shownCode = code === "-" ? "" : code.replace(/-2$/, "");
    const id = day.num + ":" + (code === "-" ? slug : code);
    SESSIONS.push({
      id, day: day.num, code: shownCode, title, kind, track,
      start: toMin(s), end: toMin(e),
      speakers: spk || "",
      url: slug ? BASE + day.slug + "/" + slug + ".aspx" : "",
    });
  }
})();
const BY_ID = Object.fromEntries(SESSIONS.map(s => [s.id, s]));
const DAY_NAME = { 15: "Sonntag", 16: "Montag", 17: "Dienstag", 18: "Mittwoch", 19: "Donnerstag", 20: "Freitag" };

// Ein Slot = alle Programmpunkte (ohne Pausen/Events) mit derselben Startzeit an einem Tag
function slotsOf(day) {
  const m = new Map();
  for (const s of SESSIONS) if (s.day === day && s.kind !== "Event") { if (!m.has(s.start)) m.set(s.start, []); m.get(s.start).push(s); }
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([start, items]) => {
    const counts = {}; items.forEach(i => counts[i.end] = (counts[i.end] || 0) + 1);
    const end = +Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
    return { day, start, end, items };
  });
}
const SLOTS = Object.fromEntries([15, 16, 17, 18, 19, 20].map(d => [d, slotsOf(d)]));
function slotAt(day, start) { return SLOTS[day].find(x => x.start === start); }

// Zustand
const store = {
  get(k, d) { try { const v = localStorage.getItem("l360or26:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("l360or26:" + k, JSON.stringify(v)); } catch {} },
};
let picked = new Set(store.get("picked", []).filter(id => BY_ID[id]));
let state = Object.assign({ view: "prog", day: 17, cmpDay: 17, cmpStart: null, back: "prog", q: "", slot: "", kind: "", tracks: [], onlyPicked: false, hideEvents: false }, store.get("ui", {}));
function saveUI() { store.set("ui", state); }
function savePicked() { store.set("picked", [...picked]); }

function overlaps(a, b) { return a.day === b.day && a.start < b.end && b.start < a.end; }
function conflictsOf(s) { const out = []; for (const id of picked) { const o = BY_ID[id]; if (o.id !== s.id && overlaps(o, s)) out.push(o); } return out; }
function conflictPairs(day) {
  const list = [...picked].map(id => BY_ID[id]).filter(s => day == null || s.day === day).sort((a, b) => a.start - b.start);
  const pairs = [];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) if (overlaps(list[i], list[j])) pairs.push([list[i], list[j]]);
  return pairs;
}

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

function renderDays() {
  $("#days").innerHTML = DAYS.map(d => {
    const n = [...picked].filter(id => BY_ID[id].day === d.num).length;
    const bad = conflictPairs(d.num).length > 0;
    return `<button role="tab" aria-selected="${state.day === d.num}" data-day="${d.num}">
      <span class="d">${d.short}${n ? `<span class="dot${bad ? " warn" : ""}">${n}</span>` : ""}</span><span class="n">${d.num}. Nov</span></button>`;
  }).join("");
  $("#plan-count").textContent = picked.size;
}

function renderTrackChips() {
  const wrap = $("#tracks");
  wrap.innerHTML = '<span class="label">Konferenz</span>' + Object.entries(TRACKS).map(([k, t]) =>
    `<button class="chip" style="--c: var(${t.c})" data-track="${k}" aria-pressed="${state.tracks.includes(k)}"><span class="sw"></span>${t.name}</button>`).join("");
}

function renderSlotSelect() {
  const starts = [...new Set(SESSIONS.filter(s => s.day === state.day).map(s => s.start))].sort((a, b) => a - b);
  if (state.slot && !starts.includes(+state.slot)) state.slot = "";
  $("#slot").innerHTML = '<option value="">Alle Zeitslots</option>' + starts.map(m => `<option value="${m}" ${+state.slot === m && state.slot !== "" ? "selected" : ""}>ab ${fmt(m)}</option>`).join("");
}

function cardHTML(s, opts = {}) {
  const t = TRACKS[s.track];
  const isPicked = picked.has(s.id);
  const conf = isPicked ? conflictsOf(s) : [];
  const wouldConf = !isPicked ? conflictsOf(s) : [];
  const cls = ["card", s.kind === "Event" ? "event" : "", isPicked ? "picked" : "", conf.length ? "conflict" : ""].join(" ");
  const titleHTML = `<button class="ttl" data-info="${s.id}">${esc(s.title)}</button>`;
  let warn = "";
  if (conf.length) warn = `<span class="warn-text">Überschneidung mit ${conf.map(c => esc(c.code || c.title.slice(0, 24) + "…")).join(", ")}</span>`;
  else if (wouldConf.length && !opts.plan) warn = `<span class="warn-text" style="color:var(--muted);font-weight:500">Kollidiert mit deiner Auswahl</span>`;
  return `<article class="${cls}" style="--c: var(${t.c})">
    <div class="meta">${s.code ? `<span class="code">${s.code}</span>` : ""}<span class="tag">${KIND_LABEL[s.kind]}</span><span>${t.short}</span>${opts.plan ? "" : `<span class="dur">· ${durText(s.end - s.start)}</span>`}</div>
    <h3>${titleHTML}</h3>
    ${s.speakers ? `<div class="spk">${esc(s.speakers)}</div>` : ""}
    <div class="card-foot">${warn}<button class="pick" data-pick="${s.id}" aria-pressed="${isPicked}">${isPicked ? STAR + "Gemerkt" : PLUS + "Merken"}</button></div>
  </article>`;
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return SESSIONS.filter(s => s.day === state.day
    && (!state.slot || s.start === +state.slot)
    && (!state.kind || s.kind === state.kind)
    && (!state.tracks.length || state.tracks.includes(s.track))
    && (!state.onlyPicked || picked.has(s.id))
    && (!state.hideEvents || s.kind !== "Event")
    && (!q || (s.title + " " + s.speakers + " " + s.code + " " + TRACKS[s.track].name).toLowerCase().includes(q)));
}

function renderProgram() {
  const list = filtered();
  const pairs = conflictPairs(state.day);
  $("#day-banner").innerHTML = pairs.length ? `<div class="banner"><span><b>${pairs.length} Überschneidung${pairs.length > 1 ? "en" : ""}</b> an diesem Tag: ${pairs.map(([a, b]) => `${esc(a.code || a.title)} ↔ ${esc(b.code || b.title)}`).join(" · ")}</span></div>` : "";
  if (!list.length) {
    $("#list").innerHTML = `<div class="empty"><h2>Keine Treffer</h2><p>Für diese Filter gibt es an diesem Tag nichts. Setz die Filter zurück oder wähle einen anderen Tag.</p></div>`;
    return;
  }
  const groups = new Map();
  for (const s of list) { if (!groups.has(s.start)) groups.set(s.start, []); groups.get(s.start).push(s); }
  const order = { Keynote: 0, Panel: 1, Workshop: 2, Lab: 2, Session: 3, "Fast Focus": 3, Event: 4 };
  const trackOrder = Object.keys(TRACKS);
  $("#list").innerHTML = [...groups.entries()].sort((a, b) => a[0] - b[0]).map(([start, items]) => {
    items.sort((a, b) => order[a.kind] - order[b.kind] || trackOrder.indexOf(a.track) - trackOrder.indexOf(b.track) || a.code.localeCompare(b.code));
    const ends = [...new Set(items.map(i => i.end))];
    const sl = slotAt(state.day, start);
    return `<section class="slot"><div class="slot-time">${fmt(start)}<small>${ends.length === 1 ? "bis " + fmt(ends[0]) : items.length + " Punkte"}</small>${sl && sl.items.length > 1 ? `<button class="slot-link" data-slot="${state.day}:${start}">Vergleichen →</button>` : ""}</div>
      <div class="cards">${items.map(s => cardHTML(s)).join("")}</div></section>`;
  }).join("");
}

function renderPlan() {
  const all = [...picked].map(id => BY_ID[id]);
  const pairs = conflictPairs(null);
  const minutes = all.filter(s => s.kind !== "Event").reduce((a, s) => a + s.end - s.start, 0);
  $("#stats").innerHTML = `<span><b>${all.length}</b>gemerkt</span><span><b>${(minutes / 60).toLocaleString("de-DE", { maximumFractionDigits: 1 })}</b>Stunden Inhalt</span><span class="${pairs.length ? "bad" : ""}"><b>${pairs.length}</b>Überschneidung${pairs.length === 1 ? "" : "en"}</span>`;
  if (!all.length) {
    $("#plan-list").innerHTML = `<div class="empty"><h2>Noch nichts gemerkt</h2><p>Tippe im Programm bei einer Session auf „Merken“. Dein Plan erscheint dann hier, Tag für Tag, mit Warnung bei Überschneidungen.</p><button class="btn primary" data-go="prog">Zum Programm</button></div>`;
    return;
  }
  $("#plan-list").innerHTML = DAYS.map(d => {
    const mine = all.filter(s => s.day === d.num);
    const dp = conflictPairs(d.num);
    // Zeilen: jeder Slot des Tages, plus gemerkte Pausen/Events
    const rows = SLOTS[d.num].map(sl => ({ t: sl.start, sl }));
    mine.filter(s => s.kind === "Event").forEach(s => rows.push({ t: s.start, ev: s }));
    rows.sort((a, b) => a.t - b.t || (a.ev ? 1 : -1));
    const freeCount = SLOTS[d.num].filter(sl => !mine.some(s => s.kind !== "Event" && s.start < sl.end && sl.start < s.end)).length;
    const html = rows.map(r => {
      if (r.ev) return `<div class="tl-item"><div class="tl-time">${fmt(r.ev.start)}<small>bis ${fmt(r.ev.end)}</small></div>${cardHTML(r.ev, { plan: true })}</div>`;
      const sl = r.sl;
      const here = mine.filter(s => s.kind !== "Event" && s.start === sl.start);
      const cover = mine.filter(s => s.kind !== "Event" && s.start !== sl.start && s.start < sl.end && sl.start < s.end);
      const time = `<div class="tl-time">${fmt(sl.start)}<small>bis ${fmt(sl.end)}</small>${sl.items.length > 1 ? `<button class="slot-link" data-slot="${d.num}:${sl.start}">${sl.items.length} Optionen →</button>` : ""}</div>`;
      if (here.length) return here.map((s, i) => `<div class="tl-item">${i ? "<div></div>" : time}${cardHTML(s, { plan: true })}</div>`).join("");
      if (cover.length) return `<div class="tl-item">${time}<div class="covered">Belegt durch ${cover.map(c => esc(c.code || c.title)).join(", ")}</div></div>`;
      return `<div class="tl-item">${time}<button class="slot-empty" data-slot="${d.num}:${sl.start}"><span><b>Noch frei</b><br>${sl.items.length} ${sl.items.length === 1 ? "Programmpunkt" : "Programmpunkte"} zur Auswahl</span><span class="go">Ansehen →</span></button></div>`;
    }).join("");
    return `<section class="plan-day${mine.length ? "" : " no-pick"}"><h2>${DAY_NAME[d.num]}, ${d.num}. November <small>${mine.length} gemerkt · ${freeCount} frei${dp.length ? ` · <span style="color:var(--danger)">${dp.length} Überschneidung${dp.length > 1 ? "en" : ""}</span>` : ""}</small></h2><div class="tl">${html}</div></section>`;
  }).join("");
}

function renderCompare() {
  const list = SLOTS[state.cmpDay];
  let idx = list.findIndex(x => x.start === state.cmpStart);
  if (idx < 0) { idx = 0; state.cmpStart = list[0].start; }
  const sl = list[idx];
  const trackOrder = Object.keys(TRACKS);
  const items = [...sl.items].sort((a, b) => trackOrder.indexOf(a.track) - trackOrder.indexOf(b.track) || a.code.localeCompare(b.code));
  const ends = [...new Set(items.map(i => i.end))].sort((a, b) => a - b);
  $("#cmp-title").innerHTML = `${DAY_NAME[sl.day]}, ${sl.day}. Nov · ${fmt(sl.start)}<small>${items.length} ${items.length === 1 ? "Programmpunkt" : "Programmpunkte"} · Ende ${ends.map(fmt).join(" / ")}</small>`;
  const mineHere = items.filter(s => picked.has(s.id));
  const blockers = [...picked].map(id => BY_ID[id]).filter(o => !sl.items.includes(o) && o.day === sl.day && o.start < sl.end && sl.start < o.end);
  $("#cmp-status").innerHTML = mineHere.length ? `Gemerkt in diesem Slot: <b>${mineHere.map(s => esc(s.code || s.title)).join(", ")}</b>${mineHere.length > 1 ? ' <span style="color:var(--danger)">(Überschneidung)</span>' : ""}`
    : blockers.length ? `Dieser Slot ist bereits belegt durch <b>${blockers.map(b => esc(b.code || b.title)).join(", ")}</b>.` : "Für diesen Slot hast du noch nichts gemerkt.";
  $("#cmp-list").className = "compare" + (items.length > 4 ? " many" : "");
  $("#cmp-list").innerHTML = items.map(s => cardHTML(s, { cmp: true })).join("");
  $("#cmp-prev").disabled = idx === 0;
  $("#cmp-next").disabled = idx === list.length - 1;
}

function render() {
  if (state.view === "cmp" && state.cmpStart == null) state.view = "prog";
  const base = state.view === "cmp" ? state.back : state.view;
  $("#v-prog").setAttribute("aria-pressed", base === "prog");
  $("#v-plan").setAttribute("aria-pressed", base === "plan");
  $("#prog").hidden = state.view !== "prog";
  $("#plan").hidden = state.view !== "plan";
  $("#cmp").hidden = state.view !== "cmp";
  $("#days").hidden = state.view !== "prog";
  renderDays();
  if (state.view === "prog") { renderSlotSelect(); renderProgram(); }
  else if (state.view === "plan") renderPlan();
  else renderCompare();
}

function planText() {
  const de = { Sunday: "So", Monday: "Mo", Tuesday: "Di", Wednesday: "Mi", Thursday: "Do", Friday: "Fr" };
  return DAYS.map(d => {
    const items = [...picked].map(id => BY_ID[id]).filter(s => s.day === d.num).sort((a, b) => a.start - b.start);
    if (!items.length) return "";
    return `${de[d.en]} ${d.num}.11.\n` + items.map(s => `  ${fmt(s.start)}–${fmt(s.end)}  ${s.code ? s.code + "  " : ""}${s.title}${s.speakers ? " (" + s.speakers + ")" : ""}${conflictsOf(s).length ? "  ⚠ Überschneidung" : ""}`).join("\n");
  }).filter(Boolean).join("\n\n");
}

function openInfo(id) {
  const s = BY_ID[id]; if (!s) return;
  const t = TRACKS[s.track]; const d = DESC[id];
  const pop = $("#pop"); pop.style.setProperty("--c", `var(${t.c})`);
  const isPicked = picked.has(s.id); const conf = conflictsOf(s);
  const facts = [KIND_LABEL[s.kind], t.name, d && d.level && d.level !== "-" ? d.level : "", d && d.track && d.track !== "-" ? d.track : ""].filter(Boolean);
  let body;
  if (d && d.summary && d.summary !== "-") {
    body = `<div><div class="lbl">Worum es geht</div><p>${esc(d.summary)}</p></div>` +
      (d.learn && d.learn !== "-" ? `<div><div class="lbl">Du lernst</div><ul>${d.learn.split(/\s*;\s*/).filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
  } else body = `<p style="color:var(--muted)">${s.kind === "Event" ? "Für diesen Programmpunkt gibt es keine Beschreibung." : "Zu dieser Session gibt es noch keine Beschreibung."}</p>`;
  pop.innerHTML = `<button class="x" id="pop-x" aria-label="Schließen">×</button>
    <div class="when">${DAY_NAME[s.day]}, ${s.day}. Nov · ${fmt(s.start)}–${fmt(s.end)}${s.code ? " · " + s.code : ""}</div>
    <h2 id="pop-title">${esc(s.title)}</h2>
    ${s.speakers ? `<div class="spk">${esc(s.speakers)}</div>` : ""}
    <div class="facts">${facts.map(f => `<span>${esc(f)}</span>`).join("")}</div>
    ${body}
    ${conf.length && isPicked ? `<div class="warn-text">Überschneidung mit ${conf.map(c => esc(c.code || c.title)).join(", ")}</div>` : !isPicked && conf.length ? `<div class="warn-text" style="color:var(--muted);font-weight:500">Kollidiert mit ${conf.map(c => esc(c.code || c.title)).join(", ")}</div>` : ""}
    <div class="pop-foot">${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">Offizielle Seite öffnen ↗</a>` : "<span></span>"}<button class="pick" data-pick="${s.id}" aria-pressed="${isPicked}">${isPicked ? STAR + "Gemerkt" : PLUS + "Merken"}</button></div>
    ${d && d.summary && d.summary !== "-" ? `<div class="note">Kurzfassung der offiziellen Beschreibung, Stand 19.10.2026.</div>` : ""}`;
  openInfo.current = id;
  $("#pop-bg").hidden = false; document.body.classList.add("noscroll");
  $("#pop-x").focus();
}
function closeInfo() { $("#pop-bg").hidden = true; document.body.classList.remove("noscroll"); const id = openInfo.current; openInfo.current = null; const b = id && document.querySelector(`[data-info="${CSS.escape(id)}"]`); if (b) b.focus(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#pop-bg").hidden) closeInfo(); });

// Ereignisse
document.addEventListener("click", e => {
  if (e.target.id === "pop-bg" || e.target.closest("#pop-x")) { closeInfo(); return; }
  const info = e.target.closest("[data-info]");
  if (info) { openInfo(info.dataset.info); return; }
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const id = pick.dataset.pick;
    if (picked.has(id)) { picked.delete(id); toast("Entfernt"); }
    else { picked.add(id); const c = conflictsOf(BY_ID[id]); toast(c.length ? "Gemerkt, überschneidet sich mit " + (c[0].code || c[0].title) : "Gemerkt"); }
    savePicked(); render(); if (openInfo.current) openInfo(openInfo.current); return;
  }
  const slotBtn = e.target.closest("[data-slot]");
  if (slotBtn) {
    const [d, st] = slotBtn.dataset.slot.split(":").map(Number);
    state.back = state.view === "cmp" ? state.back : state.view;
    Object.assign(state, { view: "cmp", cmpDay: d, cmpStart: st }); saveUI(); render(); window.scrollTo(0, 0); return;
  }
  const day = e.target.closest("[data-day]");
  if (day) { state.day = +day.dataset.day; state.slot = ""; saveUI(); render(); return; }
  const tr = e.target.closest("[data-track]");
  if (tr) { const k = tr.dataset.track; state.tracks = state.tracks.includes(k) ? state.tracks.filter(x => x !== k) : [...state.tracks, k]; saveUI(); renderTrackChips(); render(); return; }
  const go = e.target.closest("[data-go]");
  if (go) { state.view = go.dataset.go; saveUI(); render(); }
});
$("#v-prog").onclick = () => { state.view = "prog"; saveUI(); render(); };
$("#v-plan").onclick = () => { state.view = "plan"; saveUI(); render(); window.scrollTo(0, 0); };
$("#cmp-back").onclick = () => { state.view = state.back || "plan"; saveUI(); render(); };
function stepSlot(dir) {
  const list = SLOTS[state.cmpDay]; const i = list.findIndex(x => x.start === state.cmpStart) + dir;
  if (list[i]) { state.cmpStart = list[i].start; saveUI(); render(); }
}
$("#cmp-prev").onclick = () => stepSlot(-1);
$("#cmp-next").onclick = () => stepSlot(1);
$("#q").oninput = e => { state.q = e.target.value; saveUI(); renderProgram(); };
$("#slot").onchange = e => { state.slot = e.target.value; saveUI(); renderProgram(); };
$("#kind").onchange = e => { state.kind = e.target.value; saveUI(); renderProgram(); };
$("#only-picked").onchange = e => { state.onlyPicked = e.target.checked; saveUI(); renderProgram(); };
$("#hide-events").onchange = e => { state.hideEvents = e.target.checked; saveUI(); renderProgram(); };
$("#reset").onclick = () => { Object.assign(state, { q: "", slot: "", kind: "", tracks: [], onlyPicked: false, hideEvents: false }); syncInputs(); saveUI(); renderTrackChips(); render(); };
$("#clear").onclick = () => { $("#clear-confirm").hidden = false; };
$("#clear-no").onclick = () => { $("#clear-confirm").hidden = true; };
$("#clear-yes").onclick = () => { picked.clear(); savePicked(); $("#clear-confirm").hidden = true; toast("Plan geleert"); render(); };
$("#copy").onclick = () => {
  const text = planText() || "Noch nichts gemerkt.";
  const fallback = () => { $("#copy-fallback").hidden = false; const ta = $("#copy-text"); ta.value = text; ta.focus(); ta.select(); toast("Text markiert, jetzt kopieren"); };
  try { navigator.clipboard.writeText(text).then(() => toast("Plan kopiert"), fallback); } catch { fallback(); }
};
function syncInputs() {
  $("#q").value = state.q; $("#kind").value = state.kind;
  $("#only-picked").checked = state.onlyPicked; $("#hide-events").checked = state.hideEvents;
}
syncInputs(); renderTrackChips(); render();
</script>
