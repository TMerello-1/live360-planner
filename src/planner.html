}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --surface-2: #212a37; --fg: #e8edf4; --muted: #9aa5b8; --line: #2c3645;
  --accent: #4fc0dc; --accent-ink: #06222b; --accent-soft: #143440; --danger: #ff7a6b; --danger-soft: #3a1c1a; --ok: #6fcf97;
  --vs: #a98af0; --dp: #6ea5ff; --tm: #f0a252; --ai: #4fd1bd; --ea: #ec7fbd; --cr: #ff7a6b; --l3: #9aa5b8;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --surface-2: #212a37; --fg: #e8edf4; --muted: #9aa5b8; --line: #2c3645;
  --accent: #4fc0dc; --accent-ink: #06222b; --accent-soft: #143440; --danger: #ff7a6b; --danger-soft: #3a1c1a; --ok: #6fcf97;
  --vs: #a98af0; --dp: #6ea5ff; --tm: #f0a252; --ai: #4fd1bd; --ea: #ec7fbd; --cr: #ff7a6b; --l3: #9aa5b8;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 14px 0; display: grid; gap: 12px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 0.85rem; }
.views { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.views button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.views .count { font-family: var(--font-mono); font-size: 0.78rem; margin-left: 4px; color: var(--accent); }

.days { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.days::-webkit-scrollbar { display: none; }
.days button { flex: 1 0 auto; min-width: 64px; border: 0; border-bottom: 3px solid transparent; background: transparent; padding: 6px 10px 9px; text-align: center; color: var(--muted); }
.days button .d { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: inherit; }
.days button .n { display: block; font-family: var(--font-mono); font-size: 0.72rem; }
.days button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.days button .dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 0.7rem; font-family: var(--font-mono); background: var(--accent); color: var(--accent-ink); margin-left: 4px; vertical-align: 2px; }
.days button .dot.warn { background: var(--danger); color: #fff; }

.filters { padding-block: 14px; display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 0.83rem; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--fg); background: color-mix(in srgb, var(--c, var(--accent)) 12%, var(--surface)); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin-right: 4px; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: 0.85rem; padding: 4px 2px; }

.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--danger-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); border-radius: var(--radius); padding: 10px 14px; font-size: 0.9rem; }
.banner b { color: var(--danger); }

main { padding-block: 4px 48px; }
.slot { display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding-block: 14px; border-top: 1px solid var(--line); }
.slot:first-child { border-top: 0; }
.slot-time { font-family: var(--font-mono); font-weight: 500; font-size: 0.95rem; position: sticky; top: 150px; align-self: start; font-variant-numeric: tabular-nums; }
.slot-time small { display: block; color: var(--muted); font-size: 0.72rem; font-weight: 400; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; min-width: 0; }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 16px; display: grid; gap: 6px; min-width: 0; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c); }
.card.event { background: transparent; border-style: dashed; }
.card.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card.conflict { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger) inset; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.code { font-family: var(--font-mono); font-weight: 500; color: var(--c); }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
.dur { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.card h3 a { color: inherit; text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--c); }
.spk { font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
.warn-text { font-size: 0.78rem; color: var(--danger); font-weight: 600; }
.pick { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin-left: auto; white-space: nowrap; }
.pick svg { width: 14px; height: 14px; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.empty { text-align: center; color: var(--muted); padding: 48px 16px; display: grid; gap: 8px; justify-items: center; }
.empty h2 { font-family: var(--font-display); color: var(--fg); margin: 0; font-size: 1.25rem; }
.empty p { margin: 0; max-width: 46ch; }

/* Mein Plan */
.plan-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 16px 6px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.stats b { font-family: var(--font-mono); color: var(--fg); font-size: 1.05rem; margin-right: 4px; }
.stats .bad b { color: var(--danger); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 0.85rem; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost-danger { color: var(--danger); }
.plan-day { padding-block: 12px; }
.plan-day h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 6px 0 10px; display: flex; gap: 10px; align-items: baseline; }
.plan-day h2 small { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-weight: 400; }
.tl { display: grid; gap: 8px; }
.tl-item { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.tl-time { font-family: var(--font-mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; padding-top: 12px; }
.tl-time small { display: block; color: var(--muted); }
.gap { grid-column: 2; font-size: 0.78rem; color: var(--muted); padding: 2px 0 2px 16px; border-left: 2px dotted var(--line); margin-left: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; z-index: 20; }
/* Leere Slots im Plan */
.slot-empty { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 1.5px dashed var(--line); border-radius: var(--radius); background: transparent; padding: 12px 14px; color: var(--muted); }
.slot-empty:hover { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.slot-empty b { font-family: var(--font-display); font-weight: 600; color: var(--fg); font-size: 0.98rem; }
.slot-empty .go { font-size: 0.82rem; color: var(--accent); font-weight: 600; white-space: nowrap; }
.covered { font-size: 0.82rem; color: var(--muted); padding: 10px 14px; border-left: 2px dotted var(--line); }
.slot-link { display: inline-block; margin-top: 4px; border: 0; background: none; padding: 0; color: var(--accent); font-size: 0.75rem; font-family: var(--font-body); font-weight: 600; }
.slot-link:hover { text-decoration: underline; }
.tl-time button.slot-link { margin-top: 2px; }
.plan-day.no-pick h2 { color: var(--muted); }

/* Slot-Vergleich */
.cmp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 16px 10px; }
.cmp-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; text-wrap: balance; flex: 1 1 260px; }
.cmp-head h2 small { display: block; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
.cmp-nav { display: flex; gap: 6px; }
.cmp-status { font-size: 0.88rem; color: var(--muted); padding-bottom: 10px; }
.cmp-status b { color: var(--fg); }
.compare { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding-bottom: 14px; align-items: stretch; }
@media (max-width: 560px) { .compare { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 82%; overflow-x: auto; scroll-snap-type: x mandatory; } }
.compare > .card { scroll-snap-align: start; align-content: start; grid-template-rows: auto auto 1fr auto; }
.compare .card h3 { font-size: 1.05rem; }
.compare .card-foot { align-self: end; }

/* Beschreibungs-Popup */
.card h3 button.ttl { all: unset; cursor: pointer; }
.card h3 button.ttl:hover { text-decoration: underline; text-decoration-color: var(--c); text-underline-offset: 3px; }
.card h3 button.ttl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.pop { position: relative; width: min(560px, 100%); max-height: min(80vh, 640px); overflow-y: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 50px rgb(0 0 0 / 0.25); padding: 20px 22px 18px 26px; display: grid; gap: 12px; }

.pop .facts { display: flex; flex-wrap: wrap; gap: 6px; }

.pop .pop-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 12px; }
.pop .pop-foot a { color: var(--accent); font-size: 0.85rem; font-weight: 600; }
.pop .note { font-size: 0.72rem; color: var(--muted); }
body.noscroll { overflow: hidden; }
textarea.copybox { width: 100%; min-height: 160px; font-family: var(--font-mono); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px; }
footer { color: var(--muted); font-size: 0.78rem; padding-block: 0 32px; }

@media (max-width: 560px) {

  .slot-time { position: static; display: flex; gap: 8px; align-items: baseline; }
  .tl-item { grid-template-columns: 1fr; gap: 4px; }
  .tl-time { padding-top: 0; display: flex; gap: 8px; }

/*DESC*/const DESC = {"15:DPHOL01":{"summary":"A full-day, intermediate hands-on lab led by Leonard Lobel on developer features in SQL Server 2025 and Azure SQL Database. Attendees build and query with new T-SQL, JSON and vector types, semantic search, and real-time change streaming. Participants must bring their own Windows or Mac laptop.","learn":"Fuzzy matching and regex in T-SQL ; Native JSON and vector types with indexing ; RAG and semantic search using DiskANN ; Streaming data changes to Azure Event Hubs","level":"Intermediate","track":"Database Development"},"15:VSHOL01":{"summary":"This full-day hands-on lab walks attendees through building a minimal .NET API and hardening it for production use. Topics include validation, error handling, security, performance, and observability. The session closes with when to add background processing and event-driven patterns without breaking existing API contracts.","learn":"Build production-ready minimal APIs using current .NET practices ; Apply security, validation, performance, and observability patterns to real-world APIs ; Decide when to add background processing or event-driven designs","level":"Intermediate","track":"The Core of .NET"},"15:TMHOL01":{"summary":"A full-day hands-on lab where attendees build a complete two-tier certificate authority hierarchy, from an offline root CA through an enterprise issuing CA, including revocation and validation settings. Participants work in a realistic Windows Server and Active Directory environment and leave with a working, tested PKI.","learn":"Design a two-tier CA hierarchy with an offline root and online issuing CA ; Install standalone and enterprise CAs with capolicy.inf settings ; Set AIA and CDP extensions and validate them before issuing certificates ; Configure certificate templates, autoenrollment, key archival, and OCSP","level":"Introductory to Intermediate","track":"Azure: Public, Hybrid & Operations"},"15:AIHOL01":{"summary":"This beginner-friendly, full-day hands-on lab, led by Eric D. Boyd, introduces Python on Day 1 by setting up Visual Studio Code and covering core language basics. Attendees also learn about data structures, error handling, testing, debugging, and building web apps with Python.","learn":"Python basics and community coding conventions ; Data structures, error handling, and modules ; Key libraries such as NumPy, Pandas, and Matplotlib ; Automated testing, debugging, and Flask or FastAPI web apps","level":"Introductory to Intermediate","track":"Copilot & Developer Workflows"},"15:VSHOL02":{"summary":"This full-day hands-on lab walks attendees through building a complete app. They create a data access layer with Entity Framework Core, including repositories and migrations, then build an ASP.NET Core MVC web application. Copilot Agent Mode is optional for those who have it enabled.","learn":"Build a data access layer with EF Core ; Build a web app with ASP.NET Core MVC ; Use Copilot Agent mode to speed up development","level":"Intermediate","track":"Full Stack Web Development, Full Day Hands-On Labs"},"15:AIHOL02":{"summary":"This full-day hands-on lab shows how to add AI features to existing applications with Microsoft's open-source Agent Framework for C#. Participants explore extending it with memory, models, and plugins, plus telemetry, hooks, and filters for responsible AI at scale. Designed for beginners, it aims to leave attendees ready to build full agents.","learn":"Integrate AI into existing apps with Agent Framework ; Extend the framework with memory, AI models, and plugins ; Apply telemetry, hooks, and filters for AI at scale ; Build full-fledged agents","level":"Intermediate","track":"Agents & AI Engineering"},"15:VSHOL03":{"summary":"Ted Neward leads a full-day hands-on lab that refreshes C# knowledge, teaching the language as it stands in 2025 and beyond, building outward from its core. It covers the language's procedural, functional, object-oriented, dynamic, and metaobject styles, focusing on features that make code clearer. Attendees must bring their own laptop.","learn":"Modern C# idioms that have replaced older 2000-era patterns ; How C# blends multiple programming paradigms ; Language features that make code clearer and more expressive","level":"-","track":"The Core of .NET"},"15:CRHOL01":{"summary":"A full-day hands-on lab where the Defender Boys walk attendees through real-world incident response cases, from initial access to impact. Attendees join a blue team to counter escalating attacker moves in a safe, gamified setting, practicing calm decision-making under pressure.","learn":"Adaptability and analytical thinking drive effective response ; Practice in a hands-on lab to build readiness ; Identify priorities during a gamified response exercise","level":"Intermediate","track":"Purple Team, Full Day Hands-On Labs"},"15:EAHOL01":{"summary":"A full-day hands-on lab teaches attendees to identify valuable AI agent use cases, design secure multi-agent and RAG-based architectures, and run agents with governance, evaluation, and lifecycle management using Microsoft tools. Participants leave with a practical framework and working solutions.","learn":"Prioritize enterprise AI agent use cases by business outcomes and ROI ; Design scalable, secure agent architectures with multi-agent and RAG patterns ; Operationalize agents with governance, evaluation, and lifecycle management","level":"Intermediate to Advanced","track":"AI Enterprise Architecture"},"16:VSM01":{"summary":"A lecture-based workshop on Microsoft Blazor, a modern .NET framework for building web apps. It covers hosting models, the UI component model, and how Blazor fits into app architecture, including authentication and data access.","learn":"Using Blazor on the server, in the browser, and on mobile devices ; Building maintainable apps with the Blazor UI component model ; Fitting Blazor into app architecture, including authentication, authorization, and data access","level":"Intermediate to Advanced","track":"Full Stack Web Development, Workshops"},"16:VSM02":{"summary":"Led by Billy Hollis and Gary Bailey, this full-day workshop teaches developers and managers how design thinking and UX principles shape good software. Participants review real application examples and complete hands-on exercises. The goal is a practical design process to use before writing code or AI prompts.","learn":"Value of design thinking for teams and organizations ; Ways to build apps that use visual and cognitive systems ; Steps and techniques for a pre-code design process ; Injecting innovation into app development","level":"Introductory to Intermediate","track":"Developing New Experiences, Workshops"},"16:VSM03":{"summary":"A full-day workshop led by two GitHub engineers that explains how AI coding assistants work under the hood. Attendees learn about tokens, context windows, and the agentic loop, then how to tune instructions, prompt files, skills, agents, and hooks for their team. The goal is more consistent, higher-quality AI output with practical debugging skills.","learn":"How the agentic loop works, including context handling, token management, and decision-making ; Using instructions, prompt files, skills, agents, and hooks to shape AI behavior ; How token usage, context design, and model choice affect output quality ; Debugging and tuning AI tools to get reliable results","level":"Intermediate","track":"Modern Software Engineering, Workshops"},"16:VSM04":{"summary":"This full-day workshop teaches developers to extend GitHub Copilot using custom agents, prompts, hooks, skills, and MCP servers. Participants practice planning, coding, reviewing, and automating tasks, then build their own AI apps with the GitHub Copilot SDK.","learn":"Configure Copilot behavior with agent files, instructions, and hooks ; Build custom MCP servers and VS Code extensions ; Create AI apps powered by the GitHub Copilot SDK ; Automate planning, coding, and review tasks with Copilot","level":"Intermediate","track":"The Core of .NET, Workshops"},"16:DPM01":{"summary":"A full-day, hands-on workshop that introduces Microsoft Fabric as a platform, covering OneLake, compute engines, and architecture. It then walks through building solutions with warehouses, lakehouses, mirroring, real-time intelligence, and OLTP databases, plus developer tools and Copilot/Data Agents features.","learn":"Fabric architecture, OneLake, compute engines, and benchmarks ; Building solutions with warehouses, lakehouses, and mirroring ; Real-Time Intelligence and OLTP database workloads ; Fabric developer tools, Copilots, and Data Agents","level":"Introductory to Intermediate","track":"Data Engineering and Data Management, Workshops"},"16:DPM02":{"summary":"This day-long pre-con workshop covers SQL Server high availability options, including failover clusters (with geographically dispersed setups), database mirroring, Always On Availability Groups, and log shipping. Attendees also learn how to choose the right solution and deploy it correctly.","learn":"Failover cluster concepts ; Database mirroring fundamentals ; Always On Availability Groups ; Selecting and deploying the right HA solution","level":"Intermediate","track":"Database Platforms, Tuning, and Administration, Workshops"},"16:TMM01":{"summary":"A one-day advanced workshop for IT pros managing identities across on-premises Active Directory and Microsoft Entra ID. Sander Berkouwer and Michael van Horenbeeck cover hybrid join, sync, Conditional Access, tiering, and fixing common failures like replication, DNS, and Kerberos problems.","learn":"Designing a secure hybrid identity setup ; Diagnosing and fixing common hybrid AD failures ; Hardening AD against modern attack paths","level":"Advanced","track":"Core Infrastructure & Identity"},"16:TMM02":{"summary":"This full-day intermediate workshop shows how to bring on-premises Windows and Linux servers under Microsoft Defender for Cloud through Azure Arc. It covers deploying the Connected Machine Agent at small and large scale, enabling monitoring, configuring alerts, and troubleshooting. The aim is to manage server security as easily as laptops and phones.","learn":"Azure Arc fundamentals ; Defender for Cloud essentials ; Deploying Defender to non-Azure machines","level":"Intermediate","track":"Azure: Public, Hybrid & Operations, Workshops"},"16:AIHOL01-2":{"summary":"This full-day Day 2 lab introduces AI with Python, covering search, machine learning, neural networks, and language processing using Scikit-learn, TensorFlow, and NLTK. It also covers Azure Machine Learning and generative AI, including LLMs and prompt engineering with LangChain. Day 1 attendance or strong Python skills are required.","learn":"Build search and ML solutions in Python ; Explore neural networks and natural language processing ; Work with LLMs and prompt engineering via LangChain ; Deploy models using Azure Machine Learning","level":"Introductory to Intermediate","track":"Copilot & Developer Workflows, Full Day Hands-On Labs"},"16:AIM01":{"summary":"A full-day Live! 360 workshop, led by Brian Randell and Matt Nunn, that maps the key patterns for building an AI solution on the Microsoft stack. Attendees follow live demos covering models, retrieval, agents, MCP, evaluation, security, and deployment with GitHub and Azure.","learn":"Choose, access, and ground models with agents and tool use ; Turn demos into solutions through evaluation, observability, and security ; Deploy with GitHub and Azure ; Weigh cost, hosting, and tradeoffs to decide what to build","level":"Intermediate","track":"AI App Patterns"},"16:EAM01":{"summary":"This hands-on, vendor-neutral workshop explores how generative AI models are built and integrated into applications. Topics include APIs, RAG, agents, local model hosting, and image, audio, and video generation.","learn":"How generative models are trained and deployed ; Working with AI APIs and SDKs ; Integrating RAG, prompt engineering, and tool calling ; Running AI models locally","level":"Introductory to Intermediate","track":"AI Enterprise Architecture"},"16:CRM01":{"summary":"Dave Kawula and Émile Cabot, authors of a book on red and blue teaming with Microsoft Defender XDR, lead this workshop. Attendees run simulated attacks with open-source tools, then use Defender XDR to detect and respond to them.","learn":"Core red teaming concepts ; Running red team exercises with Covenant C2 and Mimikatz ; Detecting and responding to threats with Defender XDR ; Offensive and defensive security techniques","level":"Intermediate","track":"Red Team Tactics and Techniques"},"16:CRM02":{"summary":"This one-day workshop gives IT and security staff a foundation in quantum cryptography and why it matters for security. Attendees cover the quantum physics concepts behind it, quantum-resistant encryption options, and how quantum computers could affect today's protocols.","learn":"Quantum physics basics for cryptography ; Quantum-safe encryption approaches ; Quantum threats to current protocols ; Career value of quantum security knowledge","level":"Introductory to Intermediate","track":"AI in Cybersecurity: Attack, Defense, & Governance"},"17:vsl-key-vs-ai":{"summary":"Mads Kristensen, principal product manager for Visual Studio at Microsoft, looks beyond Visual Studio 2026 toward Visual Studio 2027. He argues that as AI agents take on more coding, developer judgment in defining problems, reviewing output, and keeping software maintainable matters more. He also previews tools for testing, diagnostics, custom agents, and agent skills.","learn":"Developer judgment matters more as AI agents write code ; Define the right problem and orchestrate AI-assisted workflows ; Review AI output to keep software reliable and maintainable ; Visual Studio tooling for testing, diagnostics, custom agents, and agent skills","level":"Everyone","track":"-"},"17:dpl-keynote":{"summary":"-","learn":"-","level":"Everyone","track":"-"},"17:tm-key-account-compromised":{"summary":"A security instructor describes how his primary Microsoft 365 account was compromised while he was teaching at a conference. He walks through the investigation, the response, and why defenses must not depend on people getting everything right, with stronger identity controls limiting the damage.","learn":"Expertise doesn't prevent compromise ; Check for malicious mailbox rules and unfamiliar sign-ins ; Recognize device-code authentication abuse ; Strengthen identity controls and prepare for breach before it happens","level":"Everyone","track":"TechMentor & Cybersecurity & Ransomware Live!"},"17:ail_aieal-keynote":{"summary":"Jeff Prosise's keynote argues that common agentic AI designs, especially multi-agent swarms, can be far slower, costlier, and less reliable than necessary. It introduces CodeGen agents, which use tools by generating code instead of relying on the LLM tools protocol, and shows how to build them to scale.","learn":"Why conventional agentic app architectures may underperform ; What CodeGen agents are and how they differ from LLM tool calling ; How to write CodeGen agents ; How to use them to build scalable agents","level":"Everyone","track":"Keynotes, General Sessions & Panels, AI Enterprise Architecture"},"17:VST01":{"summary":"Philip Japikse shows how to build web apps with ASP.NET Core using MVC, Razor Pages, or both. He covers .NET Core basics, configuration, dependency injection, routing, model binding, validation, views, and tag helpers.","learn":"Creating apps with MVC ; Building pages with Razor Pages ; Core ASP.NET web fundamentals","level":"Intermediate","track":"Full Stack Web Development"},"17:VST02":{"summary":"Billy Hollis presents a structured, goal-driven method for observing and questioning users, then analyzing those observations. He covers effective listening, discussion techniques, and a spreadsheet-based process that helps the whole team learn from user feedback throughout app development, without taking longer than casual observation.","learn":"Observe users with clear goals ; Turn observations into a practical, usable format ; Consolidate findings and share lessons across the team","level":"Introductory","track":"Developing New Experiences"},"17:VST03":{"summary":"This session explores why teams create branches and when branching helps versus when it hides unclear priorities, fear-driven development, or weak release planning. Speaker Benjamin Day covers workflows from trunk-based development and feature flags to Git Flow-lite, and how to match one to team size, release cadence, and deployment approach.","learn":"Judge when branching adds value versus masking process problems ; Match branching strategy to release strategy and CI/CD flow ; Use Git practices that simplify merges and support continuous delivery","level":"Intermediate to Advanced","track":"Modern Software Engineering"},"17:VST04":{"summary":"Ted Neward introduces Python for .NET developers, explaining how the language runs and how its syntax and semantics compare to what they know. Its dynamic typing and indentation-based blocks make it approachable, and its strength in data science makes it a useful second language.","learn":"Understand how Python works ; Pick up most of Python's syntax and semantics ; Get comfortable using Python as a second language","level":"Intermediate","track":"The Core of .NET"},"17:DPT01":{"summary":"This session explains how to prepare data for AI, covering ingestion, transformation, storage, and exposing prepared data to AI applications. It also addresses AI-specific needs, such as managing a semantic layer that gives data meaningful structure. It targets data engineers, architects, and AI practitioners building AI-ready pipelines.","learn":"Why data quality drives successful AI implementations ; The major phases of data preparation ; Data characteristics that make it AI-ready","level":"Introductory to Intermediate","track":"AI and Context"},"17:DPT02":{"summary":"This session shows how to cut cloud spending before considering moving workloads back to on-premises infrastructure. Attendees will learn to right-size instances, autoscale, find idle resources, tune databases, and compare VMs with managed services.","learn":"Right-size instances, weighing spot, reserved, and standard options ; Use autoscaling and microservices to match demand ; Find unused or unattached resources that still incur charges ; Tune SQL and database design to reduce wasted CPU and I/O","level":"Intermediate","track":"Database Platforms, Tuning, and Administration"},"17:TMT01":{"summary":"This session shares practical lessons from real enterprise passwordless rollouts, cutting through vendor hype. It covers deploying Windows Hello for Business, Microsoft Authenticator, and FIDO2 keys, plus common pitfalls and phased planning.","learn":"Spot top technical and organizational failure points early and avoid them ; Match Windows Hello, Authenticator, or FIDO2 to each user group ; Build a phased rollout plan with realistic timelines for legacy apps and user resistance","level":"Introductory to Intermediate","track":"Security for IT Professionals"},"17:TMT02":{"summary":"This session shows how to use Microsoft Defender for Cloud beyond Azure, protecting on-premises servers and other clouds through Azure Arc. Attendees will see practical hybrid operations guidance and demos, plus ways to unify security tooling across legacy and multi-cloud environments.","learn":"Defender for Cloud's posture management and threat protection capabilities ; How Defender for Cloud compares with and complements Defender for Endpoint ; Deploying Defender to non-Azure machines via Azure Arc ; Prerequisites, automation, and integration tips for hybrid deployments","level":"Intermediate","track":"Azure: Public, Hybrid & Operations"},"17:TMT03":{"summary":"This session shows Active Directory administrators how existing AD management and security tools can serve as a stepping stone toward a full identity governance program. It covers turning a disorganized AD environment into one that is secure, compliant, and ready for audits, plus a practical path to enterprise-wide governance.","learn":"Build a streamlined, secure AD environment that is ready for governance ; Move from AD-centric identity management to enterprise-wide identity governance ; Keep AD admins productive while satisfying compliance and security teams","level":"Introductory to Intermediate","track":"Security for IT Professionals"},"17:AIT01":{"summary":"Brian A. Randell examines where AI-assisted development stands in 2026, using primary research to separate measurable gains from hype. He covers rising adoption alongside falling trust, the verification gap, and the shifting costs of AI tools, with live demos. The session argues that the core developer skill is becoming validating AI-generated code.","learn":"Where AI adoption, trust, and measured productivity stand in 2026 ; Why \"almost right\" code and the verification gap matter more than acceptance rates ; How the developer role is shifting from writing code to validating it ; Which skills to invest in next","level":"Intermediate","track":"Agents & AI Engineering"},"17:AIT02":{"summary":"This session teaches application developers to add AI features to existing apps using standard APIs and SDKs, without a data science team. It covers classification, summarization, semantic search, data extraction, and content generation, including embeddings, RAG pipelines, and function calling.","learn":"Tools for adding language models to existing .NET apps ; Guidance on error handling, testing, and cost control ; Steps for retrofitting AI into a current application","level":"Intermediate","track":"AI App Patterns"},"17:EAT01":{"summary":"This session builds AI agents from a basic model of a harness, a language model, and a directive, then extends it to chat-driven, event-driven, and tool-using designs. It treats agents like microservices, applying familiar distributed-systems practices to security, scaling, and reliability, and surveys standards such as MCP and A2A plus registries and governance.","learn":"Define an agent as harness, LLM, and directive, then extend it ; Apply microservice discipline to agent security, scale, and reliability ; Map emerging standards like MCP and A2A ; Understand discoverability, registries, and governance for agents","level":"Intermediate","track":"AI Enterprise Architecture"},"17:CRT01":{"summary":"This session from Defender Boys filters the fast-moving Microsoft Defender XDR updates down to those that matter most for security operations. Speakers Mattias Borg and Stefan Schörling cover how new features affect detection, investigation, and response, plus what needs enabling. Attendees leave with a clear, non-overwhelming path to adopt updates.","learn":"Expert insights on the latest Defender XDR changes ; Practical steps to adopt new features without extra complexity ; Which capabilities are on by default and which need a settings change","level":"Intermediate","track":"Threat Intelligence & Human Risk"},"17:CRT02":{"summary":"Microsoft MVP Andy Malone leads a demo-heavy session on Microsoft Entra ID, explaining how the identity platform works and how to secure it. Attendees will get practical tips for keeping attackers out and limiting their access. It suits anyone responsible for keeping cloud users safe.","learn":"Current identity threats ; How to defend against them ; How the tools really work","level":"Intermediate","track":"Red Team Tactics and Techniques"},"17:l360keynote-agents-ai":{"summary":"This keynote, led by Kayla Cinnamon and Jon Galloway of Microsoft, shows how AI agents and tools help people turn ideas into working software, from brainstorming through debugging. It shares how organizations scale agentic development and Microsoft's own lessons, plus ways to keep quality and governance in place.","learn":"Using AI agents across brainstorming, prototyping, building, and debugging ; Scaling agentic development in organizations ; Lessons from Microsoft's own adoption ; Keeping quality, governance, and control over AI-built work","level":"Everyone","track":"-"},"17:VST05":{"summary":"This 20-minute session covers lesser-known Git features that many developers overlook. Attendees will see tools for controlling checkouts and commits, ways to attach extra metadata to commits, and productivity tips for working with repositories.","learn":"Power tools for managing checkouts ; Attaching extra metadata to commits ; Boosting productivity in Git repositories","level":"Intermediate","track":"The Core of .NET, Fast Focus"},"17:VST06":{"summary":"This 20-minute Fast Focus session shows how to add API documentation to an ASP.NET Core RESTful service. Philip Japikse covers why documenting services matters, how to document them, and how to display the docs using Scalar.","learn":"Why documenting services matters ; How to document services ; How to display documentation with Scalar","level":"Intermediate","track":"Full Stack Web Development, Fast Focus"},"17:VST07":{"summary":"Jim Wooley's short session reviews what Entity Framework Core has added since its latest long-term support release. It also considers how those changes could influence decisions in your applications.","learn":"Review EF Core features added since the last LTS version ; Track ongoing EF Core changes over time ; Share feedback or contribute new features to EF Core","level":"Intermediate","track":"Data & Analytics"},"17:VST08":{"summary":"This 20-minute session introduces Moq, a popular .NET mocking library, for isolating dependencies in unit tests with minimal setup code. Attendees will learn to stub interfaces and methods, verify behavior, and judge when mocking helps versus hurts. It also covers common pitfalls that make tests brittle.","learn":"Isolate dependencies in unit tests with Moq ; Judge when mocking helps versus harms ; Stub interfaces and method calls ; Verify calls and return values in C# tests","level":"Intermediate","track":"Modern Software Engineering, Fast Focus"},"17:DPT03":{"summary":"This introductory session by Microsoft's Bradley Ball traces the history of AI up to large language models and explains why DBAs should care. It covers using LLMs for database work, vectorized AI search, and retrieval augmented generation, plus how to choose models and watch their deprecation dates.","learn":"Brief history of AI leading to LLMs ; Using LLMs for DBA work in VS Code or SSMS with GitHub Copilot ; Basics of vectorized AI search and RAG patterns ; Choosing models and checking deprecation dates","level":"Introductory","track":"AI and Context, Fast Focus"},"17:DPT04":{"summary":"This Fast Focus session explains how Fabric mirroring copies SQL Server data into OneLake almost in real time, which suits operational reporting. Attendees will see the underlying replication process, setup choices, and ways to track whether replication is healthy.","learn":"Grasp the replication mechanism behind SQL Server mirroring in Fabric ; Review the available mirroring configuration options ; Monitor replication health with logging and tooling","level":"Introductory","track":"Database Platforms, Tuning, and Administration"},"17:TMT04":{"summary":"Émile Cabot, a Microsoft MVP, explores the various ways to deliver apps through Microsoft Intune and explains why no single deployment method suits every scenario. Attendees will compare the pros and cons of each delivery approach and learn how to prepare apps for packaging in Intune.","learn":"Survey the app deployment methods available in Intune ; Weigh the strengths and drawbacks of each delivery method ; Prepare apps properly for packaging in Intune","level":"Introductory to Intermediate","track":"Client and Endpoint Management, Fast Focus"},"17:TMT05":{"summary":"This session shows how to turn on and use Windows Admin Center's new Virtualization Mode for managing Hyper-V virtual machines in a simpler way. Attendees will also see where it fits among other virtualization tools and how to avoid conflicts with them.","learn":"Setting up and operating vMode within WAC ; How vMode fits alongside other virtualization tools ; Steering clear of conflicts with other management tools","level":"Introductory to Intermediate","track":"Core Infrastructure & Identity, Fast Focus"},"17:AIT03":{"summary":"This demo-driven session introduces Microsoft Foundry Agent Service, a runtime that unifies models, tools, and frameworks while handling conversations, tool calls, and safety. It shows how organizations can build extensible, enterprise-ready AI agents.","learn":"Foundry Agent Service key concepts ; Extending agents with tools such as automatic tool calling, code interpreter, and file retrieval ; Best practices for production agents ; Building enterprise-grade agents and workflows","level":"Introductory","track":"AI App Patterns, Fast Focus"},"17:EAT02":{"summary":"A facilitated, non-slide session where three experienced architects design real-world AI scenarios live on a shared whiteboard with attendees. They examine security, identity, scaling, resiliency, token management, cost, and governance, showing how trade-offs get resolved in real time.","learn":"Break an AI scenario into core concerns such as security and scaling ; Weigh trade-offs when no single design is clearly right ; Apply reusable enterprise AI architecture patterns ; Ask the right questions when designing your own AI solutions","level":"Intermediate","track":"AI Enterprise Architecture"},"17:CRT03":{"summary":"This session shows how to run a five-step PKI health check in about five minutes using built-in Windows tools on a CA server. It covers silent failures such as expired CA certificates, stale CRLs, and unreachable distribution points that can break VPN, smart card logon, and web access. Attendees leave with a repeatable checklist and guidance on responding to failed checks.","learn":"Run a five-step PKI health check in about five minutes with built-in tools ; Recognize silent PKI failures like expired CA certificates and stale CRLs ; Schedule CRL expiration and CA certificate monitoring instead of reacting to outages ; Know what each check result means and what to do when it fails","level":"Introductory to Intermediate","track":"Threat Intelligence & Human Risk, Fast Focus"},"17:CRT04":{"summary":"This 20-minute Fast Focus session covers five key security topics for executives and the C-suite. It is aimed at IT professionals and offers guidance on how to engage senior leaders in cybersecurity conversations.","learn":"Top 5 security topics for executives ; How to engage the C-Suite on cyber security","level":"Intermediate","track":"AI in Cybersecurity: Attack, Defense, & Governance, Fast Focus"},"17:VST09":{"summary":"Brian A. Randell compares Azure DevOps and GitHub in 2026, arguing that choosing one is often the wrong frame. He examines Microsoft's push to combine both platforms for agentic features, along with the usage-based billing that makes costs harder to forecast. The talk offers a practical way to choose based on team workflow and tolerance for cost variability.","learn":"Where each platform stands in 2026 ; What Microsoft's combined model delivers and what it now costs ; A practical framework for choosing based on team workflow and cost tolerance","level":"Intermediate","track":"Modern Software Engineering"},"17:VST10":{"summary":"This introductory 20-minute session compares Angular, React, and Vue by their strengths, tradeoffs, and typical use cases. It also places Blazor and WebAssembly in the landscape for Microsoft-focused teams and highlights factors that help in choosing a front-end option.","learn":"Main web client frameworks and libraries ; Key differences among Angular, React, and Vue ; Where WebAssembly and Blazor fit ; Factors that guide choosing a framework","level":"Introductory","track":"Full Stack Web Development, Fast Focus"},"17:VST11":{"summary":"This session treats visibility as a practical engineering skill rather than self-promotion. It explores why skilled developers often go unnoticed and how that affects trust and opportunities, then shows everyday ways to make decisions and contributions clear to others. It is aimed at making impact understandable, not at building a personal brand.","learn":"Why high-quality technical work often goes unnoticed ; Difference between self-promotion and professional visibility ; Simple techniques to make technical contributions visible","level":"Introductory","track":"Human Factors in Engineering"},"17:VST12":{"summary":"This Fast Focus session by Jason Bock explores how .NET's risky, low-level APIs can deliver small performance gains when standard code falls short. It covers their trade-offs and how to use them safely.","learn":"Weigh the trade-offs of risky APIs ; See how these APIs can improve code ; Discover other useful .NET APIs","level":"Intermediate to Advanced","track":"The Core of .NET"},"17:DPT05":{"summary":"This Fast Focus session covers SQL Server and Azure SQL system-versioned temporal tables, which record data history automatically so you can query how data looked at any past point. It explains key use cases and how system time works, then demonstrates the T-SQL syntax in a live demo.","learn":"Key scenarios for temporal tables ; Getting started with temporal tables ; Best practices for temporal tables ; Limitations of temporal tables","level":"Intermediate","track":"Database Development, Fast Focus"},"17:DPT06":{"summary":"Denny Cherry's Live! 360 session explains when SQL Server can use several indexes on one table. It also covers why the engine does this and how to write queries that make it happen.","learn":"How SQL Server uses multiple indexes per table ; When SQL Server chooses to use multiple indexes per table ; How to write queries that use multiple indexes per table","level":"Intermediate to Advanced","track":"Database Platforms, Tuning, and Administration, Fast Focus"},"17:TMT06":{"summary":"This session shows how Microsoft To Do and Planner work together to manage tasks across Outlook, Teams, and other Microsoft 365 apps. Attendees will get ten practical tips for building a simple task routine that fits their workday.","learn":"Differences between To Do and Planner task types ; Turning Outlook emails and Teams messages into tasks ; Forming lasting task routines","level":"Introductory","track":"Microsoft 365 Operations & Identity, Fast Focus"},"17:TMT07":{"summary":"This session introduces Azure Storage vocabulary and recommends tools, practices, and a mindset for newcomers. It shows how built-in monitoring and reports can strengthen security, and gives experienced users an update on current features and workarounds for common challenges. It also covers storage management interfaces and lifecycle handling.","learn":"Grasp foundational Azure Storage vocabulary ; Protect and track storage using native tooling ; Handle storage lifecycle management and practical obstacles","level":"Introductory","track":"Azure: Public, Hybrid & Operations, Fast Focus"},"17:AIT04":{"summary":"Buck Woody explains how to write effective LLM prompts using \"Brain\" files and why setting context matters for Agentic AI.","learn":"Writing effective LLM prompts with \"Brain\" files ; Importance of setting context for Agentic AI","level":"Introductory","track":"Grounding & Context"},"17:CRT05":{"summary":"This 20-minute session addresses burnout among IT professionals in always-on environments. Speaker Derek Michals draws on experience with 2 a.m. outages and high-pressure escalations to offer ways to stay composed, prioritize under pressure, and build sustainable workflows.","learn":"Spot burnout early ; Reduce stress during critical incidents ; Prioritize under pressure ; Foster a well-being culture in IT operations","level":"Introductory to Intermediate","track":"Ransomware Industry, Fast Focus"},"17:CRT06":{"summary":"This 20-minute session shows how to configure Microsoft Entra cross-tenant access settings for B2B guest users. It explains how to accept MFA completed in a guest's home tenant while still checking device compliance, and includes short demos of the setup and the guest sign-in experience.","learn":"Configure guest trust with Entra cross-tenant access settings ; Recognize the limits of device compliance and MFA token handling across tenants ; Decide when this approach fits and when it does not","level":"Advanced","track":"Purple Team, Fast Focus"},"17:VST13":{"summary":"Brian A. Randell demonstrates agentic DevOps on GitHub and Azure DevOps, covering coding agents that turn issues into pull requests and repository automation for triage and CI follow-up. It also explores similar patterns for Azure DevOps while keeping governance, review, and security in place. Attendees will learn where AI helps and where it adds risk.","learn":"Where coding agents fit across GitHub and Azure DevOps workflows ; Guardrails for AI-assisted coding, automation, review, and release ; Metrics and warning signs of hidden delivery debt from AI use","level":"Intermediate","track":"Modern Software Engineering"},"17:VST14":{"summary":"This session shows how to build a polished chat interface for an AI assistant in Blazor, based on experience with a production chat assistant. It covers streamed responses, showing agent steps and tool calls, and optional diagnostics, metrics, and token cost views for advanced users.","learn":"Design a Blazor chat interface that feels immediate through streaming and progressive feedback ; Show agent activity and tool calls without overwhelming users ; Add optional diagnostics, metrics, and token or cost visibility for power users","level":"Intermediate","track":"Developing New Experiences"},"17:VST15":{"summary":"A fast-paced tour of Visual Studio led by Microsoft's Mads Kristensen, covering old and new features most developers likely don't know about. Attendees will learn to use more of the IDE's capabilities to work more productively.","learn":"Discover lesser-known Visual Studio features ; Apply both new and older IDE capabilities ; Boost day-to-day productivity in Visual Studio","level":"Intermediate","track":"The Core of .NET"},"17:VST16":{"summary":"Ted Neward introduces the Go programming language, which gained traction after its mid-2010s debut and is now an up-and-coming option. The session examines Go's strengths and limitations, covers basic syntax, and prepares attendees to build larger Go programs.","learn":"Go syntax ; Go's semantics and deployment ; Why Go is interesting ; First steps toward non-trivial Go programs","level":"Intermediate","track":"The Core of .NET"},"17:DPT07":{"summary":"This session walks developers through new SQL Server 2025 capabilities, including enhanced T-SQL features such as fuzzy matching and regular expressions. It also covers Change Event Streaming for real-time data reactions, native JSON improvements, and vector data with DiskANN indexing for AI-driven semantic search inside T-SQL.","learn":"Fuzzy matching and regex in T-SQL ; Change Event Streaming and native JSON features ; Vector data and DiskANN indexing ; AI model integration for semantic search and RAG in T-SQL","level":"Intermediate","track":"Database Development"},"17:DPT08":{"summary":"-","learn":"-","level":"-","track":"-"},"17:TMT08":{"summary":"Presenter Heather Severino demonstrates recent Microsoft 365 updates across apps like Outlook, Teams, OneDrive, SharePoint, and Copilot. The session compares new and classic Outlook, covers Teams chat and channel changes, and shows how AI features can streamline work. It suits IT staff, executives, and everyday users alike.","learn":"Identify new features being introduced ; Use timesaving shortcuts ; Be more productive with Microsoft 365 apps and services","level":"Introductory","track":"Microsoft 365 Operations & Identity"},"17:TMT09":{"summary":"Identity Architect Sander Berkouwer presents a field-tested method for moving Domain Controllers from older Windows Server versions to Windows Server 2025. The session explains why a transition is preferred over an in-place upgrade and how to handle common obstacles.","learn":"Reasons to transition Domain Controllers instead of upgrading in place ; Step-by-step method for transitioning Domain Controllers ; Ways to overcome common transition obstacles","level":"Advanced","track":"Core Infrastructure & Identity"},"17:TMT10":{"summary":"This session explores how IT teams are preparing their Hyper-V environments for 2027, covering infrastructure refreshes, hybrid management, disaster recovery, capacity planning, and overall resilience. Speaker Tony Joy shares real client examples of deciding between internal management and a managed environment.","learn":"Planning Hyper-V infrastructure refreshes ; Approaches to hybrid management and disaster recovery ; Capacity planning for resilience ; Choosing between in-house and managed Hyper-V environments","level":"Intermediate","track":"Core Infrastructure & Identity"},"17:AIT05":{"summary":"-","learn":"-","level":"-","track":"-"},"17:AIT06":{"summary":"This talk uses The Hitchhiker's Guide to the Galaxy as a metaphor for developers facing rapid AI-driven change. It argues that the developer's role is shifting from writing every line toward systems thinking, governance, and responsible ownership. Rather than an ending, AI is presented as a new beginning, with developers acting as guides who set guardrails.","learn":"AI is not to be feared ; How to stay relevant in an AI-driven world ; What to focus on as you incorporate AI into your workflow","level":"Introductory","track":"AI App Patterns"},"17:EAT03":{"summary":"This session explores how manufacturers can use AI, data, and automation to modernize operations. Topics include tying machine data to ERP, connecting shop-floor equipment, and reducing manual paperwork. Examples span mill, automotive, healthcare, life sciences, high-tech, and meat industries.","learn":"Linking machine data to ERP systems ; Connecting shop-floor equipment and cutting paperwork ; Automating data exchange across enterprise systems ; Building and running AI agents and workflows","level":"Intermediate to Advanced","track":"AI Enterprise Architecture"},"17:CRT07":{"summary":"This session shows security professionals how to build a Security Copilot agent, presented by the Defender Boys, moving from fundamentals through design and deployment of a first use case. Live demos cover connecting data, defining logic, and automating enrichment and analyst support while keeping risk under control.","learn":"Automating repetitive security tasks and enriching investigations with agents ; Scalable, practical patterns for building agents that meet real needs ; Planning and risk mitigation to stay in control of agent behavior","level":"Intermediate","track":"Blue Team"},"17:CRT08":{"summary":"This session examines how weaknesses in industrial control devices can enable serious disruption of critical infrastructure, using a real case of an attack on Ukraine's power grid. Presenter Maarten Goet includes a live demonstration of exploiting an ICS device and shows how Microsoft Defender for IoT detects attacks in OT environments.","learn":"Recognize current operational technology threats ; Review OT attacks from the past decade ; Apply practical defensive measures for industrial environments","level":"Advanced","track":"Blue Team"},"17:VST17":{"summary":"This session reviews the many language improvements added to C# over its 20-plus-year history. It shows how newer features can make code more concise and performant, and how tools can help modernize existing code. It suits experienced C# developers who want to update their knowledge.","learn":"Trace the evolution of C# ; See how tools help modernize code ; Understand how newer language features work ; Write more concise, higher-performing code","level":"Intermediate","track":"The Core of .NET"},"17:VST18":{"summary":"Angela Dugan examines imposter syndrome among IT professionals, including fear of being exposed as unqualified and worry that AI could replace them. She shares personal experiences of asking for help, building resilience, and embracing her own uncertainty, and considers when this anxiety becomes unhealthy.","learn":"Defining imposter syndrome ; Spotting its signs in yourself and others ; Turning imposter feelings into growth opportunities","level":"Introductory to Intermediate","track":"Human Factors in Engineering"},"17:VST19":{"summary":"This session shows developers who didn't write tests first how to start adding them to existing applications. It covers the different kinds of testing, strategies for legacy code, and code changes such as refactoring for injection and mocking that make code easier to test.","learn":"Differences between unit, integration, and functional testing ; Starting tests in existing codebases ; Refactoring for injection and mocking ; When to change code to improve testability","level":"Introductory to Intermediate","track":"Modern Software Engineering"},"17:VST20":{"summary":"Billy Hollis shows how the Uno Platform uses WebAssembly and XAML to deliver near-desktop UI interaction, styling, and navigation in the browser. He shares advanced XAML design techniques for common business problems, aimed at web apps that go beyond HTML-based single page apps. Prior XAML experience helps but is not required.","learn":"Advanced browser UI without CSS ; Building web apps that surpass HTML-based SPAs ; XAML techniques for business UI problems","level":"Introductory to Intermediate","track":"Full Stack Web Development"},"17:DPT09":{"summary":"This session shows data professionals how Copilot can speed up Power BI development, from generating DAX and visuals based on plain-English requests to helping transform files in Power Query. It also explores new data agents and where AI is headed for semantic models.","learn":"Build visuals with Copilot ; Transform files using Copilot in Power Query ; Understand new data agents ; Explore the future of AI in semantic models","level":"Intermediate","track":"AI for BI"},"17:DPT10":{"summary":"This session demonstrates how to protect data in Microsoft Fabric through a live demo covering network isolation, private links, least-privilege workspace and item sharing, row- and column-level security, and OneLake-wide protection. It also explains when to combine these controls and which steps to prioritize for new or existing environments.","learn":"Fabric data security options ; When to apply single controls versus layering them ; Foundational security steps for new Fabric environments ; Priority security fixes for existing environments","level":"Introductory","track":"Data Engineering and Data Management"},"17:TMT11":{"summary":"This session walks through the redesigned Outlook, comparing it with the classic version and showing how it provides a consistent experience across Windows and the web. It also covers guiding users through the switch and deciding when an organization should adopt it.","learn":"Spot the key differences between classic and new Outlook ; Guide users through moving from classic to new Outlook ; Determine the right moment for your organization to adopt new Outlook","level":"Introductory","track":"Microsoft 365 Operations & Identity"},"17:TMT12":{"summary":"This session covers controlling Azure spending after deployment or migration. It explains how FinOps, which blends finance and operations, fits into the Cloud Adoption Framework journey. Attendees will learn to track consumption, use Azure tools to find savings, and apply reservations and licensing benefits.","learn":"Track Azure spending and usage ; Find savings with built-in Azure tools ; Lower costs with reservations and licensing benefits ; Apply FinOps early in cloud adoption","level":"Intermediate","track":"Core Infrastructure & Identity"},"17:TMT13":{"summary":"Microsoft MVP Derek Melber shares real-world Active Directory designs that connect on-prem AD with Entra ID. Topics include MFA, SSO, passwordless sign-in, and privileged access. Attendees will learn how to integrate these tools and strengthen their infrastructure.","learn":"Why AD should integrate with other platforms ; Capabilities and limits of AD and Entra ID ; Applying real-world scenarios to harden infrastructure","level":"Intermediate to Advanced","track":"Security for IT Professionals"},"17:AIT07":{"summary":"Kevin Feasel's session gives developers a candid look at Microsoft Foundry, covering its model catalog, agent development, code integration, evaluation tools, and managed deployments. It also addresses pricing complexity, documentation gaps, and vendor lock-in, to help teams judge whether Foundry fits them.","learn":"Functionality available in Microsoft Foundry ; Features that make Foundry compelling ; Shortfalls and rough edges of Foundry","level":"Introductory","track":"AI App Patterns"},"17:AIT08":{"summary":"Mayuri Lahane's interactive, demo-driven session covers prompt engineering basics and advanced techniques such as few-shot, chain-of-thought, persona-based, and multi-step prompting. Attendees also learn to debug AI responses and use reasoning models like o3.","learn":"Prompt engineering basics and its role in generative AI ; Few-shot, chain-of-thought, persona-based, and multi-step prompting ; Debugging and refining prompts with reasoning models like o3 ; Prompt engineering best practices","level":"Intermediate","track":"Models & Evaluation"},"17:EAT04":{"summary":"The session explains why technically sound AI systems often fail to earn executive confidence, pointing to weak data foundations, unclear ownership, and governance gaps rather than model accuracy. Ashley Rivera offers architectural principles to align data design, integration boundaries, and operating models with leadership expectations for responsible, scalable AI.","learn":"Assessing whether current data architecture can support enterprise AI at scale ; Spotting architecture, ownership, and governance gaps that undermine trust in AI decisions ; Designing integration and operating models that tie AI to executive decision-making","level":"Intermediate","track":"AI Enterprise Architecture"},"17:CRT09":{"summary":"This session covers responding to a compromised Active Directory, which many organizations still rely on for identity despite its age. Speaker Michael Van Horenbeeck walks through real incident response scenarios, post-breach challenges, and lessons learned. Attendees will leave with guidance on recovery, re-hardening, and modernizing AD security.","learn":"Phases of incident response ; What to do after an AD compromise ; What to avoid during recovery ; Re-hardening and modernizing AD security","level":"Advanced","track":"Purple Team"},"17:CRT10":{"summary":"Sami Laiho examines how the security threat landscape changed during 2025 and the first half of 2026. The session covers shifts in attacker tactics, emerging risks, and trends that will shape future security strategies.","learn":"How the current threat landscape has changed ; Emerging risks and evolving attacker behavior ; The most successful attack vectors of the past year and how to defend against them","level":"Introductory to Intermediate","track":"Ransomware Industry"},"18:VSW01":{"summary":"This session goes beyond TypeScript fundamentals for developers already building apps with it. It explores advanced types, decorators, mixins, generics, and declaration merging, and shows how they can make web client development more powerful.","learn":"Advanced TypeScript features beyond the basics ; Building on core language features for stronger client code ; Decorators, mixins, symbols, and generics ; Discriminated unions and declaration merging","level":"Intermediate to Advanced","track":"Full Stack Web Development"},"18:VSW02":{"summary":"This session cuts through AI hype to show what current tools do well, where human expertise and oversight remain necessary, and how engineers can use AI to improve quality, boost creativity, and expand their impact. It is aimed at technologists uncertain about their careers.","learn":"Current strengths and limits of AI in software development ; When human oversight is still essential ; Using AI to improve quality and creativity ; Using AI to grow technical impact and career prospects","level":"Introductory to Intermediate","track":"Human Factors in Engineering"},"18:VSW03":{"summary":"This session shows .NET developers how to speed up applications by understanding what their code does at runtime. Attendees will see profiling and diagnostic tools that locate performance bottlenecks and help fix them.","learn":"Diagnose and resolve code-level performance problems ; Prevent inefficient code before it becomes a problem ; Use .NET profiling tools to find and fix slow code","level":"Intermediate to Advanced","track":"The Core of .NET"},"18:VSW04":{"summary":"This session shows how teams can run lightweight, flexible project workflows inside GitHub Projects, adapting the process to their own needs instead of a rigid framework. Attendees will see how to manage backlogs, estimates, and priorities with custom fields, views, milestones, and automation, plus burndown-style charts.","learn":"Build a lean, developer-focused workflow using GitHub Projects, Issues, and fields ; Follow work items, sizing, and status without heavy Scrum rules ; Create burndown-style charts and dashboards that match how your team works","level":"Intermediate","track":"Modern Software Engineering"},"18:DPW01":{"summary":"This session explains how to structure Microsoft Fabric workspaces, including network and security design. Attendees will cover naming conventions, deployment practices, capacity management, and governance standards for enterprise use.","learn":"Proven approaches for rolling out and maintaining Fabric ; Setting up governance rules and guardrails in Fabric ; Managing Fabric across an organization at scale","level":"Intermediate","track":"Data Engineering and Data Management"},"18:DPW02":{"summary":"This session helps developers choose a vector store by matching it to their data type: unstructured, semi-structured, or structured. It compares PostgreSQL, Cosmos DB, and SQL Server, and explains the DiskANN algorithm for semantic nearest-neighbor search.","learn":"PostgreSQL as a vectorization database ; Cosmos DB as a vectorization database ; SQL Server as a vectorization database ; DiskANN nearest-neighbor search for semantic queries","level":"Intermediate","track":"Database Development"},"18:TMW01":{"summary":"This introductory session shares lessons from a fairly new speaker on which approaches succeed and which backfire. It covers common pitfalls, practical tips for impactful presentations, and ways to manage imposter syndrome.","learn":"Mistakes to avoid as a speaker ; Tactics for delivering successful talks ; Overcoming imposter syndrome","level":"Introductory","track":"Soft Skills & Career Development for IT Pros"},"18:TMW02":{"summary":"Michael Niehaus of 2Pint Software revives bare-metal OS deployment, a practice many consider outdated, and shows how it fits into today's environments. Attendees will learn when a deployment solution is needed, the core steps involved, and the tools and techniques available.","learn":"When an OS deployment solution is needed ; Core steps of the deployment process ; Available deployment tools and techniques ; Modern approaches to bare-metal deployment","level":"Advanced","track":"Client and Endpoint Management"},"18:TMW03":{"summary":"This session shows how to launch an internal newsletter with Microsoft Outlook's built-in feature. Presenter Karinne Bessette covers attracting early subscribers, defining scope, keeping branding consistent, and layout and content practices that keep readers engaged, for new and existing newsletters.","learn":"Set up newsletters with Outlook's built-in tools ; Attract seed subscribers and define a clear scope ; Maintain consistent branding across issues ; Apply layout practices and avoid common pitfalls","level":"Introductory","track":"Soft Skills & Career Development for IT Pros"},"18:AIW01":{"summary":"This session shows how to build enterprise AI agents that understand business context, use trusted data, and take real action. Through best practices and live demos, it combines Work IQ, Foundry IQ, and Fabric IQ with the Microsoft Agents stack.","learn":"Ground agents in work roles and business processes ; Design and orchestrate agent behavior with Foundry IQ ; Power agents with secure enterprise data via Fabric IQ ; Assemble an end-to-end agent on the Microsoft Agent stack","level":"Advanced","track":"-"},"18:AIW02":{"summary":"Microsoft's Kayla Cinnamon presents a demo-heavy session on using GitHub Copilot across the CLI, VS Code, Visual Studio, and cloud workflows. Attendees follow a feature built end-to-end as work moves between tools, with an honest look at each surface's strengths and where context breaks down.","learn":"Using GitHub Copilot across multiple platforms ; Choosing which Copilot platform suits a given task ; Combining all Copilot platforms into one end-to-end workflow","level":"Intermediate to Advanced","track":"Copilot & Developer Workflows"},"18:EAW01":{"summary":"This session explains why observability matters more in agentic architectures. It covers bringing agent telemetry into overall application signals, designing topologies that collect data from agentic and non-agentic components, making agent and LLM telemetry OpenTelemetry compliant, and turning raw AI signals into performance and health insights.","learn":"Apply instrumentation to agentic systems ; Structure architectures so agents and LLMs are observable ; Turn agent signals into performance and health insights","level":"Intermediate","track":"AI Enterprise Architecture"},"18:CRW01":{"summary":"Sami Laiho explains why organizations of all sizes should move from traditional VPNs to Zero Trust Network Access, which grants identity-based access only to needed applications and checks trust continuously. The session covers reducing attack surface, limiting lateral movement, and resisting ransomware and credential theft.","learn":"Authenticating and validating every communication ; Treating every network as untrusted ; Recognizing that internal networks no longer provide a safe boundary","level":"Intermediate","track":"Blue Team"},"18:CRW02":{"summary":"Dave Kawula draws on years of real ransomware recoveries to present SADA/SADAN, a segmented network design built to resist ransomware. The session covers a reference architecture for separating critical systems, backups, and management layers, plus containment tactics that hold up during an active breach.","learn":"Isolate hypervisors, backup systems, Active Directory, and management planes ; Use dual AD forests and privileged access zones ; Deploy immutable storage, network firebreaks, and offline backup paths ; Apply containment strategies that work during a live breach","level":"Intermediate","track":"AI in Cybersecurity: Attack, Defense, & Governance"},"18:VSW05":{"summary":"This session shows how Angular signals can simplify state management and remove manual subscriptions. Deborah Kurata covers declaring and using signals, then loading data into them with the Resource API. Attendees build a signal-first app with practical examples.","learn":"Understand what signals are and why they matter ; Best practices for creating, reading, and reacting to signals ; Retrieve data directly into signals with the Resource API","level":"Introductory to Intermediate","track":"Full Stack Web Development"},"18:VSW06":{"summary":"This session defends microservices against recent criticism of their complexity and operational overhead. The speaker highlights their benefits for scalability, fault tolerance, and independent deployment, shares real-world lessons, and compares them with monoliths, n-tier systems, and modular monoliths.","learn":"Where microservices aid continuous delivery, scalability, and resilience ; Strategies to reduce complexity and operational problems ; Lessons from real projects compared with other architectures","level":"Intermediate","track":"Cloud, Containers & Microservices"},"18:VSW07":{"summary":"This session introduces the Model Context Protocol (MCP), a standard that helps AI agents work with software in a contextual way. Attendees build a basic MCP server in C# on .NET and learn to expose parts of existing applications to AI agents in internal and commercial systems.","learn":"Introduction to MCP ; Cohesive, functional modeling of MCP endpoints ; Modernizing legacy applications with MCP","level":"Intermediate","track":"Modern Software Engineering"},"18:DPW03":{"summary":"This session shows analysts how notebooks can handle the same tasks as Dataflow Gen2, covering sourcing, transformations, cleansing, and destinations. Topics include joins, text replacement, column splitting and merging, pivoting, type changes, and deduplication in PySpark, plus ingestion optimization in Microsoft Fabric.","learn":"Matching Dataflow transformations to PySpark equivalents ; Building data engineering skills from an analyst background ; Optimizing data ingestion in Microsoft Fabric","level":"Intermediate","track":"Data Engineering and Data Management"},"18:DPW04":{"summary":"Microsoft speakers help database professionals choose among Azure SQL, Managed Instance, Fabric Data Warehouse, and Fabric SQL Database when moving workloads to Azure. They share field lessons on assessing readiness, sizing VMs and service tiers, and matching capacity, offering a decision framework and migration tradeoffs.","learn":"Comparing migration and assessment tools for PaaS and SaaS targets ; Judging database readiness and choosing the right Azure SQL tier ; Sizing VMs and mapping workloads to Fabric capacity ; Schema and data migration tradeoffs between VM-based and Fabric-native approaches","level":"Intermediate","track":"Database Platforms, Tuning, and Administration"},"18:TMW04":{"summary":"This session covers designing PowerShell tools with the people who will use them in mind. Jeffery Hicks argues that generating working code is the easier part, so attendees should also weigh compatibility, user needs, and how a tool fits into wider pipelines.","learn":"Limits of AI and code generation ; Essential questions to ask when writing code ; Building more effective, user-focused PowerShell tools","level":"Intermediate to Advanced","track":"PowerShell, Automation & DevOps"},"18:TMW05":{"summary":"This session covers on-premises Active Directory fundamentals, starting at a beginner pace and moving into advanced material. Topics include domain controller roles, authentication, Group Policy, password policies, FSMO roles, replication, and delegation. It suits newcomers and those who haven't worked with AD in a while.","learn":"Core Active Directory components ; Configuring key AD settings ; Advanced delegation ; Advanced Group Policy","level":"Intermediate to Advanced","track":"Core Infrastructure & Identity"},"18:TMW06":{"summary":"This session explores the AI-focused processing hardware in modern Intel x86 and Qualcomm ARM64 chips and the Windows 11 features that run AI tasks on-device rather than in the cloud. It also covers how developers can build on these local capabilities.","learn":"What on-device AI silicon can do ; Built-in Windows 11 features that use local AI ; Ways developers can apply local AI capabilities","level":"Intermediate","track":"AI for IT Professionals"},"18:AIW03":{"summary":"This session covers how to design leaner multi-agent systems on Azure that avoid overloading each agent with unnecessary information. It focuses on scoped context, targeted handoffs, memory management, and planner/router patterns to make systems faster, cheaper, and easier to debug and scale.","learn":"Impact of context size on performance ; Using long-term memory ; Reducing token costs","level":"Intermediate","track":"Agents & AI Engineering"},"18:AIW04":{"summary":"Mark Perry shares his daily experience using Claude Code, a terminal-based AI coding agent, across ASP.NET Core APIs, React frontends, and Azure projects. He compares it with GitHub Copilot, demonstrates real workflows, and shows prompting techniques for production-ready code.","learn":"Setting up Claude Code for ASP.NET Core workflows ; Comparing Claude Code and GitHub Copilot ; Prompting patterns that produce production-quality code instead of demos","level":"Intermediate","track":"Copilot & Developer Workflows"},"18:EAW02":{"summary":"Samantha St-Louis explains how enterprises can shift from scattered AI experiments to unified agentic platforms that generate measurable business value. The session covers coordinating multiple agents, sharing context, avoiding redundant work, and prioritizing architecture and standards over speed.","learn":"Stages of AI innovation maturity ; Moving from experimentation to strategy-driven AI ; Encouraging innovation while preventing AI sprawl","level":"Introductory","track":"AI Enterprise Architecture"},"18:CRW03":{"summary":"Sami Laiho presents eleven real-world methods attackers could use to compromise Windows 11, covering built-in weaknesses and common misconfigurations. Each live demo comes with practical defenses for hardening environments. The session is intermediate, demo-driven, and fast-paced.","learn":"Misconfigurations that most often lead to Windows compromise ; Steps to harden a Windows 11 environment ; Core Windows security principles and how to apply them in real scenarios","level":"Intermediate","track":"Red Team Tactics and Techniques"},"18:CRW04":{"summary":"This session examines how attackers exploit the trust and authority given to service desk staff, turning helpfulness into a security weakness. It covers real-world scenarios
