/* Layout: kompakte Kopfleiste mit Tages-Reitern, darunter ein Zeitstrahl nach Startzeit; "Mein Plan" als zweite Ansicht */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #e9edf3;
  --fg: #141a24;
  --muted: #5b6577;
  --line: #d6dce6;
  --accent: #0b6e8a;
  --accent-ink: #ffffff;
  --accent-soft: #d9eef4;
  --danger: #c2372b;
  --danger-soft: #fbe3e0;
  --ok: #2f7d4f;
  --vs: #6a3fb5; --dp: #1f63c6; --tm: #c46a10; --ai: #0f8a79; --ea: #b0347c; --cr: #c2372b; --l3: #59647a;
  --font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141c; --surface: #171e29; --surface-2: #212a37; --fg: #e8edf4; --muted: #9aa5b8; --line: #2c3645;
  --accent: #4fc0dc; --accent-ink: #06222b; --accent-soft: #143440; --danger: #ff7a6b; --danger-soft: #3a1c1a; --ok: #6fcf97;
  --vs: #a98af0; --dp: #6ea5ff; --tm: #f0a252; --ai: #4fd1bd; --ea: #ec7fbd; --cr: #ff7a6b; --l3: #9aa5b8;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #171e29; --surface-2: #212a37; --fg: #e8edf4; --muted: #9aa5b8; --line: #2c3645;
  --accent: #4fc0dc; --accent-ink: #06222b; --accent-soft: #143440; --danger: #ff7a6b; --danger-soft: #3a1c1a; --ok: #6fcf97;
  --vs: #a98af0; --dp: #6ea5ff; --tm: #f0a252; --ai: #4fd1bd; --ea: #ec7fbd; --cr: #ff7a6b; --l3: #9aa5b8;
  color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { padding-block: 14px 0; display: grid; gap: 12px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 0.85rem; }
.views { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.views button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.views .count { font-family: var(--font-mono); font-size: 0.78rem; margin-left: 4px; color: var(--accent); }

.days { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
.days::-webkit-scrollbar { display: none; }
.days button { flex: 1 0 auto; min-width: 64px; border: 0; border-bottom: 3px solid transparent; background: transparent; padding: 6px 10px 9px; text-align: center; color: var(--muted); }
.days button .d { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: inherit; }
.days button .n { display: block; font-family: var(--font-mono); font-size: 0.72rem; }
.days button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.days button .dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 0.7rem; font-family: var(--font-mono); background: var(--accent); color: var(--accent-ink); margin-left: 4px; vertical-align: 2px; }
.days button .dot.warn { background: var(--danger); color: #fff; }

.filters { padding-block: 14px; display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 0.83rem; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--fg); background: color-mix(in srgb, var(--c, var(--accent)) 12%, var(--surface)); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; margin-right: 4px; }
.link-btn { border: 0; background: none; color: var(--accent); font-size: 0.85rem; padding: 4px 2px; }

.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--danger-soft); color: var(--fg); border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent); border-radius: var(--radius); padding: 10px 14px; font-size: 0.9rem; }
.banner b { color: var(--danger); }

main { padding-block: 4px 48px; }
.slot { display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding-block: 14px; border-top: 1px solid var(--line); }
.slot:first-child { border-top: 0; }
.slot-time { font-family: var(--font-mono); font-weight: 500; font-size: 0.95rem; position: sticky; top: 150px; align-self: start; font-variant-numeric: tabular-nums; }
.slot-time small { display: block; color: var(--muted); font-size: 0.72rem; font-weight: 400; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; min-width: 0; }

.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 12px 16px; display: grid; gap: 6px; min-width: 0; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c); }
.card.event { background: transparent; border-style: dashed; }
.card.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card.conflict { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger) inset; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.75rem; color: var(--muted); }
.code { font-family: var(--font-mono); font-weight: 500; color: var(--c); }
.tag { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
.dur { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.card h3 a { color: inherit; text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--c); }
.spk { font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
.warn-text { font-size: 0.78rem; color: var(--danger); font-weight: 600; }
.pick { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 0.82rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin-left: auto; white-space: nowrap; }
.pick svg { width: 14px; height: 14px; }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.empty { text-align: center; color: var(--muted); padding: 48px 16px; display: grid; gap: 8px; justify-items: center; }
.empty h2 { font-family: var(--font-display); color: var(--fg); margin: 0; font-size: 1.25rem; }
.empty p { margin: 0; max-width: 46ch; }

/* Mein Plan */
.plan-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding-block: 16px 6px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.stats b { font-family: var(--font-mono); color: var(--fg); font-size: 1.05rem; margin-right: 4px; }
.stats .bad b { color: var(--danger); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-size: 0.85rem; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost-danger { color: var(--danger); }
.plan-day { padding-block: 12px; }
.plan-day h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 6px 0 10px; display: flex; gap: 10px; align-items: baseline; }
.plan-day h2 small { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-weight: 400; }
.tl { display: grid; gap: 8px; }
.tl-item { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.tl-time { font-family: var(--font-mono); font-size: 0.85rem; font-variant-numeric: tabular-nums; padding-top: 12px; }
.tl-time small { display: block; color: var(--muted); }
.gap { grid-column: 2; font-size: 0.78rem; color: var(--muted); padding: 2px 0 2px 16px; border-left: 2px dotted var(--line); margin-left: 6px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; z-index: 20; }
/* Leere Slots im Plan */
.slot-empty { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; border: 1.5px dashed var(--line); border-radius: var(--radius); background: transparent; padding: 12px 14px; color: var(--muted); }
.slot-empty:hover { border-color: var(--accent); color: var(--fg); background: var(--accent-soft); }
.slot-empty b { font-family: var(--font-display); font-weight: 600; color: var(--fg); font-size: 0.98rem; }
.slot-empty .go { font-size: 0.82rem; color: var(--accent); font-weight: 600; white-space: nowrap; }
.covered { font-size: 0.82rem; color: var(--muted); padding: 10px 14px; border-left: 2px dotted var(--line); }
.slot-link { display: inline-block; margin-top: 4px; border: 0; background: none; padding: 0; color: var(--accent); font-size: 0.75rem; font-family: var(--font-body); font-weight: 600; }
.slot-link:hover { text-decoration: underline; }
.tl-time button.slot-link { margin-top: 2px; }
.plan-day.no-pick h2 { color: var(--muted); }

/* Slot-Vergleich */
.cmp-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 16px 10px; }
.cmp-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; text-wrap: balance; flex: 1 1 260px; }
.cmp-head h2 small { display: block; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); font-weight: 400; margin-top: 2px; }
.cmp-nav { display: flex; gap: 6px; }
.cmp-status { font-size: 0.88rem; color: var(--muted); padding-bottom: 10px; }
.cmp-status b { color: var(--fg); }
.compare { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding-bottom: 14px; align-items: stretch; }
@media (max-width: 560px) { .compare { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 82%; overflow-x: auto; scroll-snap-type: x mandatory; } }
.compare > .card { scroll-snap-align: start; align-content: start; grid-template-rows: auto auto 1fr auto; }
.compare .card h3 { font-size: 1.05rem; }
.compare .card-foot { align-self: end; }

textarea.copybox { width: 100%; min-height: 160px; font-family: var(--font-mono); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px; }
footer { color: var(--muted); font-size: 0.78rem; padding-block: 0 32px; }
footer a { color: var(--muted); }

@media (max-width: 560px) {
  .slot { grid-template-columns: 1fr; gap: 8px; }
  .slot-time { position: static; display: flex; gap: 8px; align-items: baseline; }
  .tl-item { grid-template-columns: 1fr; gap: 4px; }
  .tl-time { padding-top: 0; display: flex; gap: 8px; }
  .gap { grid-column: 1; }
  .cards { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

const TRACKS = {
  VS: { name: "Visual Studio Live!", short: "VS Live!", c: "--vs" },
  DP: { name: "Data Platform Live!", short: "Data Platform", c: "--dp" },
  TM: { name: "TechMentor", short: "TechMentor", c: "--tm" },
  AI: { name: "Artificial Intelligence Live!", short: "AI Live!", c: "--ai" },
  EA: { name: "AI Enterprise Architecture Live!", short: "AI Architecture", c: "--ea" },
  CR: { name: "Cybersecurity & Ransomware Live!", short: "Cyber Live!", c: "--cr" },
  L3: { name: "Live! 360 gesamt", short: "Live! 360", c: "--l3" },
};
const KIND_LABEL = { Session: "Session", "Fast Focus": "Fast Focus", Workshop: "Workshop", Lab: "Hands-On Lab", Keynote: "Keynote", Panel: "Panel", Event: "Event" };
const BASE = "https://live360events.com/events/orlando-2026/sessions/";

function toMin(t) {
  const m = t.trim().match(/^(\d{1,2}):(\d{2})(am|pm)$/i);
  let h = +m[1] % 12; if (m[3].toLowerCase() === "pm") h += 12;
  return h * 60 + +m[2];
}
function fmt(min) { return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); }
function durText(d) { const h = Math.floor(d / 60), m = d % 60; return (h ? h + " h" : "") + (h && m ? " " : "") + (m ? m + " min" : ""); }

const DAYS = [];
const SESSIONS = [];
(function parse() {
  let day = null;
  for (const line of RAW.split("\n")) {
    if (!line.trim()) continue;
    if (line.startsWith("#")) {
      const [num, en, short] = line.slice(1).split(" ");
      day = { num: +num, en, short, slug: en.toLowerCase() };
      DAYS.push(day); continue;
    }
    const [code, rawTitle, time, spk, slug, trackHint] = line.split("|");
    const [s, e] = time.split("-");
    let kind;
    if (/^(2-Day )?Hands-On Lab/i.test(rawTitle)) kind = "Lab";
    else if (/^(Hands-on )?Workshop:/i.test(rawTitle) || /^Hands-On Workshop:/i.test(rawTitle)) kind = "Workshop";
    else if (/^Fast Focus:/i.test(rawTitle)) kind = "Fast Focus";
    else if (/Keynote/i.test(rawTitle)) kind = "Keynote";
    else if (/Panel Discussion/i.test(rawTitle)) kind = "Panel";
    else if (code === "-") kind = "Event";
    else kind = "Session";
    const title = rawTitle.replace(/^(2-Day )?Hands-On Lab:\s*/i, m => m.startsWith("2-Day") ? "2-Tage-Lab: " : "")
      .replace(/^(Hands-on )?Workshop:\s*/i, "").replace(/^Fast Focus:\s*/i, "");
    const track = code === "-" ? (trackHint || "L3") : code.slice(0, 2);
    const shownCode = code === "-" ? "" : code.replace(/-2$/, "");
    const id = day.num + ":" + (code === "-" ? slug : code);
    SESSIONS.push({
      id, day: day.num, code: shownCode, title, kind, track,
      start: toMin(s), end: toMin(e),
      speakers: spk || "",
      url: slug ? BASE + day.slug + "/" + slug + ".aspx" : "",
    });
  }
})();
const BY_ID = Object.fromEntries(SESSIONS.map(s => [s.id, s]));
const DAY_NAME = { 15: "Sonntag", 16: "Montag", 17: "Dienstag", 18: "Mittwoch", 19: "Donnerstag", 20: "Freitag" };

// Ein Slot = alle Programmpunkte (ohne Pausen/Events) mit derselben Startzeit an einem Tag
function slotsOf(day) {
  const m = new Map();
  for (const s of SESSIONS) if (s.day === day && s.kind !== "Event") { if (!m.has(s.start)) m.set(s.start, []); m.get(s.start).push(s); }
  return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([start, items]) => {
    const counts = {}; items.forEach(i => counts[i.end] = (counts[i.end] || 0) + 1);
    const end = +Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
    return { day, start, end, items };
  });
}
const SLOTS = Object.fromEntries([15, 16, 17, 18, 19, 20].map(d => [d, slotsOf(d)]));
function slotAt(day, start) { return SLOTS[day].find(x => x.start === start); }

// Zustand
const store = {
  get(k, d) { try { const v = localStorage.getItem("l360or26:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("l360or26:" + k, JSON.stringify(v)); } catch {} },
};
let picked = new Set(store.get("picked", []).filter(id => BY_ID[id]));
let state = Object.assign({ view: "prog", day: 17, cmpDay: 17, cmpStart: null, back: "prog", q: "", slot: "", kind: "", tracks: [], onlyPicked: false, hideEvents: false }, store.get("ui", {}));
function saveUI() { store.set("ui", state); }
function savePicked() { store.set("picked", [...picked]); }

function overlaps(a, b) { return a.day === b.day && a.start < b.end && b.start < a.end; }
function conflictsOf(s) { const out = []; for (const id of picked) { const o = BY_ID[id]; if (o.id !== s.id && overlaps(o, s)) out.push(o); } return out; }
function conflictPairs(day) {
  const list = [...picked].map(id => BY_ID[id]).filter(s => day == null || s.day === day).sort((a, b) => a.start - b.start);
  const pairs = [];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) if (overlaps(list[i], list[j])) pairs.push([list[i], list[j]]);
  return pairs;
}

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

function renderDays() {
  $("#days").innerHTML = DAYS.map(d => {
    const n = [...picked].filter(id => BY_ID[id].day === d.num).length;
    const bad = conflictPairs(d.num).length > 0;
    return `<button role="tab" aria-selected="${state.day === d.num}" data-day="${d.num}">
      <span class="d">${d.short}${n ? `<span class="dot${bad ? " warn" : ""}">${n}</span>` : ""}</span><span class="n">${d.num}. Nov</span></button>`;
  }).join("");
  $("#plan-count").textContent = picked.size;
}

function renderTrackChips() {
  const wrap = $("#tracks");
  wrap.innerHTML = '<span class="label">Konferenz</span>' + Object.entries(TRACKS).map(([k, t]) =>
    `<button class="chip" style="--c: var(${t.c})" data-track="${k}" aria-pressed="${state.tracks.includes(k)}"><span class="sw"></span>${t.name}</button>`).join("");
}

function renderSlotSelect() {
  const starts = [...new Set(SESSIONS.filter(s => s.day === state.day).map(s => s.start))].sort((a, b) => a - b);
  if (state.slot && !starts.includes(+state.slot)) state.slot = "";
  $("#slot").innerHTML = '<option value="">Alle Zeitslots</option>' + starts.map(m => `<option value="${m}" ${+state.slot === m && state.slot !== "" ? "selected" : ""}>ab ${fmt(m)}</option>`).join("");
}

function cardHTML(s, opts = {}) {
  const t = TRACKS[s.track];
  const isPicked = picked.has(s.id);
  const conf = isPicked ? conflictsOf(s) : [];
  const wouldConf = !isPicked ? conflictsOf(s) : [];
  const cls = ["card", s.kind === "Event" ? "event" : "", isPicked ? "picked" : "", conf.length ? "conflict" : ""].join(" ");
  const titleHTML = s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title);
  let warn = "";
  if (conf.length) warn = `<span class="warn-text">Überschneidung mit ${conf.map(c => esc(c.code || c.title.slice(0, 24) + "…")).join(", ")}</span>`;
  else if (wouldConf.length && !opts.plan) warn = `<span class="warn-text" style="color:var(--muted);font-weight:500">Kollidiert mit deiner Auswahl</span>`;
  return `<article class="${cls}" style="--c: var(${t.c})">
    <div class="meta">${s.code ? `<span class="code">${s.code}</span>` : ""}<span class="tag">${KIND_LABEL[s.kind]}</span><span>${t.short}</span>${opts.plan ? "" : `<span class="dur">· ${durText(s.end - s.start)}</span>`}</div>
    <h3>${titleHTML}</h3>
    ${s.speakers ? `<div class="spk">${esc(s.speakers)}</div>` : ""}
    <div class="card-foot">${warn}<button class="pick" data-pick="${s.id}" aria-pressed="${isPicked}">${isPicked ? STAR + "Gemerkt" : PLUS + "Merken"}</button></div>
  </article>`;
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return SESSIONS.filter(s => s.day === state.day
    && (!state.slot || s.start === +state.slot)
    && (!state.kind || s.kind === state.kind)
    && (!state.tracks.length || state.tracks.includes(s.track))
    && (!state.onlyPicked || picked.has(s.id))
    && (!state.hideEvents || s.kind !== "Event")
    && (!q || (s.title + " " + s.speakers + " " + s.code + " " + TRACKS[s.track].name).toLowerCase().includes(q)));
}

function renderProgram() {
  const list = filtered();
  const pairs = conflictPairs(state.day);
  $("#day-banner").innerHTML = pairs.length ? `<div class="banner"><span><b>${pairs.length} Überschneidung${pairs.length > 1 ? "en" : ""}</b> an diesem Tag: ${pairs.map(([a, b]) => `${esc(a.code || a.title)} ↔ ${esc(b.code || b.title)}`).join(" · ")}</span></div>` : "";
  if (!list.length) {
    $("#list").innerHTML = `<div class="empty"><h2>Keine Treffer</h2><p>Für diese Filter gibt es an diesem Tag nichts. Setz die Filter zurück oder wähle einen anderen Tag.</p></div>`;
    return;
  }
  const groups = new Map();
  for (const s of list) { if (!groups.has(s.start)) groups.set(s.start, []); groups.get(s.start).push(s); }
  const order = { Keynote: 0, Panel: 1, Workshop: 2, Lab: 2, Session: 3, "Fast Focus": 3, Event: 4 };
  const trackOrder = Object.keys(TRACKS);
  $("#list").innerHTML = [...groups.entries()].sort((a, b) => a[0] - b[0]).map(([start, items]) => {
    items.sort((a, b) => order[a.kind] - order[b.kind] || trackOrder.indexOf(a.track) - trackOrder.indexOf(b.track) || a.code.localeCompare(b.code));
    const ends = [...new Set(items.map(i => i.end))];
    const sl = slotAt(state.day, start);
    return `<section class="slot"><div class="slot-time">${fmt(start)}<small>${ends.length === 1 ? "bis " + fmt(ends[0]) : items.length + " Punkte"}</small>${sl && sl.items.length > 1 ? `<button class="slot-link" data-slot="${state.day}:${start}">Vergleichen →</button>` : ""}</div>
      <div class="cards">${items.map(s => cardHTML(s)).join("")}</div></section>`;
  }).join("");
}

function renderPlan() {
  const all = [...picked].map(id => BY_ID[id]);
  const pairs = conflictPairs(null);
  const minutes = all.filter(s => s.kind !== "Event").reduce((a, s) => a + s.end - s.start, 0);
  $("#stats").innerHTML = `<span><b>${all.length}</b>gemerkt</span><span><b>${(minutes / 60).toLocaleString("de-DE", { maximumFractionDigits: 1 })}</b>Stunden Inhalt</span><span class="${pairs.length ? "bad" : ""}"><b>${pairs.length}</b>Überschneidung${pairs.length === 1 ? "" : "en"}</span>`;
  if (!all.length) {
    $("#plan-list").innerHTML = `<div class="empty"><h2>Noch nichts gemerkt</h2><p>Tippe im Programm bei einer Session auf „Merken“. Dein Plan erscheint dann hier, Tag für Tag, mit Warnung bei Überschneidungen.</p><button class="btn primary" data-go="prog">Zum Programm</button></div>`;
    return;
  }
  $("#plan-list").innerHTML = DAYS.map(d => {
    const mine = all.filter(s => s.day === d.num);
    const dp = conflictPairs(d.num);
    // Zeilen: jeder Slot des Tages, plus gemerkte Pausen/Events
    const rows = SLOTS[d.num].map(sl => ({ t: sl.start, sl }));
    mine.filter(s => s.kind === "Event").forEach(s => rows.push({ t: s.start, ev: s }));
    rows.sort((a, b) => a.t - b.t || (a.ev ? 1 : -1));
    const freeCount = SLOTS[d.num].filter(sl => !mine.some(s => s.kind !== "Event" && s.start < sl.end && sl.start < s.end)).length;
    const html = rows.map(r => {
      if (r.ev) return `<div class="tl-item"><div class="tl-time">${fmt(r.ev.start)}<small>bis ${fmt(r.ev.end)}</small></div>${cardHTML(r.ev, { plan: true })}</div>`;
      const sl = r.sl;
      const here = mine.filter(s => s.kind !== "Event" && s.start === sl.start);
      const cover = mine.filter(s => s.kind !== "Event" && s.start !== sl.start && s.start < sl.end && sl.start < s.end);
      const time = `<div class="tl-time">${fmt(sl.start)}<small>bis ${fmt(sl.end)}</small>${sl.items.length > 1 ? `<button class="slot-link" data-slot="${d.num}:${sl.start}">${sl.items.length} Optionen →</button>` : ""}</div>`;
      if (here.length) return here.map((s, i) => `<div class="tl-item">${i ? "<div></div>" : time}${cardHTML(s, { plan: true })}</div>`).join("");
      if (cover.length) return `<div class="tl-item">${time}<div class="covered">Belegt durch ${cover.map(c => esc(c.code || c.title)).join(", ")}</div></div>`;
      return `<div class="tl-item">${time}<button class="slot-empty" data-slot="${d.num}:${sl.start}"><span><b>Noch frei</b><br>${sl.items.length} ${sl.items.length === 1 ? "Programmpunkt" : "Programmpunkte"} zur Auswahl</span><span class="go">Ansehen →</span></button></div>`;
    }).join("");
    return `<section class="plan-day${mine.length ? "" : " no-pick"}"><h2>${DAY_NAME[d.num]}, ${d.num}. November <small>${mine.length} gemerkt · ${freeCount} frei${dp.length ? ` · <span style="color:var(--danger)">${dp.length} Überschneidung${dp.length > 1 ? "en" : ""}</span>` : ""}</small></h2><div class="tl">${html}</div></section>`;
  }).join("");
}

function renderCompare() {
  const list = SLOTS[state.cmpDay];
  let idx = list.findIndex(x => x.start === state.cmpStart);
  if (idx < 0) { idx = 0; state.cmpStart = list[0].start; }
  const sl = list[idx];
  const trackOrder = Object.keys(TRACKS);
  const items = [...sl.items].sort((a, b) => trackOrder.indexOf(a.track) - trackOrder.indexOf(b.track) || a.code.localeCompare(b.code));
  const ends = [...new Set(items.map(i => i.end))].sort((a, b) => a - b);
  $("#cmp-title").innerHTML = `${DAY_NAME[sl.day]}, ${sl.day}. Nov · ${fmt(sl.start)}<small>${items.length} ${items.length === 1 ? "Programmpunkt" : "Programmpunkte"} · Ende ${ends.map(fmt).join(" / ")}</small>`;
  const mineHere = items.filter(s => picked.has(s.id));
  const blockers = [...picked].map(id => BY_ID[id]).filter(o => !sl.items.includes(o) && o.day === sl.day && o.start < sl.end && sl.start < o.end);
  $("#cmp-status").innerHTML = mineHere.length ? `Gemerkt in diesem Slot: <b>${mineHere.map(s => esc(s.code || s.title)).join(", ")}</b>${mineHere.length > 1 ? ' <span style="color:var(--danger)">(Überschneidung)</span>' : ""}`
    : blockers.length ? `Dieser Slot ist bereits belegt durch <b>${blockers.map(b => esc(b.code || b.title)).join(", ")}</b>.` : "Für diesen Slot hast du noch nichts gemerkt.";
  $("#cmp-list").className = "compare" + (items.length > 4 ? " many" : "");
  $("#cmp-list").innerHTML = items.map(s => cardHTML(s, { cmp: true })).join("");
  $("#cmp-prev").disabled = idx === 0;
  $("#cmp-next").disabled = idx === list.length - 1;
}

function render() {
  if (state.view === "cmp" && state.cmpStart == null) state.view = "prog";
  const base = state.view === "cmp" ? state.back : state.view;
  $("#v-prog").setAttribute("aria-pressed", base === "prog");
  $("#v-plan").setAttribute("aria-pressed", base === "plan");
  $("#prog").hidden = state.view !== "prog";
  $("#plan").hidden = state.view !== "plan";
  $("#cmp").hidden = state.view !== "cmp";
  $("#days").hidden = state.view !== "prog";
  renderDays();
  if (state.view === "prog") { renderSlotSelect(); renderProgram(); }
  else if (state.view === "plan") renderPlan();
  else renderCompare();
}

function planText() {
  const de = { Sunday: "So", Monday: "Mo", Tuesday: "Di", Wednesday: "Mi", Thursday: "Do", Friday: "Fr" };
  return DAYS.map(d => {
    const items = [...picked].map(id => BY_ID[id]).filter(s => s.day === d.num).sort((a, b) => a.start - b.start);
    if (!items.length) return "";
    return `${de[d.en]} ${d.num}.11.\n` + items.map(s => `  ${fmt(s.start)}–${fmt(s.end)}  ${s.code ? s.code + "  " : ""}${s.title}${s.speakers ? " (" + s.speakers + ")" : ""}${conflictsOf(s).length ? "  ⚠ Überschneidung" : ""}`).join("\n");
  }).filter(Boolean).join("\n\n");
}

// Ereignisse
document.addEventListener("click", e => {
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const id = pick.dataset.pick;
    if (picked.has(id)) { picked.delete(id); toast("Entfernt"); }
    else { picked.add(id); const c = conflictsOf(BY_ID[id]); toast(c.length ? "Gemerkt, überschneidet sich mit " + (c[0].code || c[0].title) : "Gemerkt"); }
    savePicked(); render(); return;
  }
  const slotBtn = e.target.closest("[data-slot]");
  if (slotBtn) {
    const [d, st] = slotBtn.dataset.slot.split(":").map(Number);
    state.back = state.view === "cmp" ? state.back : state.view;
    Object.assign(state, { view: "cmp", cmpDay: d, cmpStart: st }); saveUI(); render(); window.scrollTo(0, 0); return;
  }
  const day = e.target.closest("[data-day]");
  if (day) { state.day = +day.dataset.day; state.slot = ""; saveUI(); render(); return; }
  const tr = e.target.closest("[data-track]");
  if (tr) { const k = tr.dataset.track; state.tracks = state.tracks.includes(k) ? state.tracks.filter(x => x !== k) : [...state.tracks, k]; saveUI(); renderTrackChips(); render(); return; }
  const go = e.target.closest("[data-go]");
  if (go) { state.view = go.dataset.go; saveUI(); render(); }
});
$("#v-prog").onclick = () => { state.view = "prog"; saveUI(); render(); };
$("#v-plan").onclick = () => { state.view = "plan"; saveUI(); render(); window.scrollTo(0, 0); };
$("#cmp-back").onclick = () => { state.view = state.back || "plan"; saveUI(); render(); };
function stepSlot(dir) {
  const list = SLOTS[state.cmpDay]; const i = list.findIndex(x => x.start === state.cmpStart) + dir;
  if (list[i]) { state.cmpStart = list[i].start; saveUI(); render(); }
}
$("#cmp-prev").onclick = () => stepSlot(-1);
$("#cmp-next").onclick = () => stepSlot(1);
$("#q").oninput = e => { state.q = e.target.value; saveUI(); renderProgram(); };
$("#slot").onchange = e => { state.slot = e.target.value; saveUI(); renderProgram(); };
$("#kind").onchange = e => { state.kind = e.target.value; saveUI(); renderProgram(); };
$("#only-picked").onchange = e => { state.onlyPicked = e.target.checked; saveUI(); renderProgram(); };
$("#hide-events").onchange = e => { state.hideEvents = e.target.checked; saveUI(); renderProgram(); };
$("#reset").onclick = () => { Object.assign(state, { q: "", slot: "", kind: "", tracks: [], onlyPicked: false, hideEvents: false }); syncInputs(); saveUI(); renderTrackChips(); render(); };
$("#clear").onclick = () => { $("#clear-confirm").hidden = false; };
$("#clear-no").onclick = () => { $("#clear-confirm").hidden = true; };
$("#clear-yes").onclick = () => { picked.clear(); savePicked(); $("#clear-confirm").hidden = true; toast("Plan geleert"); render(); };
$("#copy").onclick = () => {
  const text = planText() || "Noch nichts gemerkt.";
  const fallback = () => { $("#copy-fallback").hidden = false; const ta = $("#copy-text"); ta.value = text; ta.focus(); ta.select(); toast("Text markiert, jetzt kopieren"); };
  try { navigator.clipboard.writeText(text).then(() => toast("Plan kopiert"), fallback); } catch { fallback(); }
};
function syncInputs() {
  $("#q").value = state.q; $("#kind").value = state.kind;
  $("#only-picked").checked = state.onlyPicked; $("#hide-events").checked = state.hideEvents;
}
syncInputs(); renderTrackChips(); render();
</script>

</body>
</html>
