function toMin(t) {
  const m = t.trim().match(/^(\d{1,2}):(\d{2})(am|pm)$/i);
  let h = +m[1] % 12; if (m[3].toLowerCase() === "pm") h += 12;
  return h * 60 + +m[2];
}
function fmt(min) { return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); }
function durText(d) { const h = Math.floor(d / 60), m = d % 60; return (h ? h + " h" : "") + (h && m ? " " : "") + (m ? m + " min" : ""); }

const DAYS = [];
const SESSIONS = [];
function kindOf(code, rawTitle) {
  if (/^(2-Day )?Hands-On Lab/i.test(rawTitle)) return "Lab";
  if (/^(Hands-on )?Workshop:/i.test(rawTitle) || /^Hands-On Workshop:/i.test(rawTitle)) return "Workshop";
  if (/^Fast Focus:/i.test(rawTitle)) return "Fast Focus";
  if (/Keynote/i.test(rawTitle)) return "Keynote";
  if (/Panel Discussion/i.test(rawTitle)) return "Panel";
  return code === "-" || !code ? "Event" : "Session";
}
function cleanTitle(rawTitle) {
  return rawTitle.replace(/^(2-Day )?Hands-On Lab:\s*/i, m => m.startsWith("2-Day") ? "2-Day Lab: " : "")
    .replace(/^(Hands-on )?Workshop:\s*/i, "").replace(/^Fast Focus:\s*/i, "");
}
(function parse() {
  let day = null;
  for (const line of RAW.split("\n")) {
    if (!line.trim()) continue;
    if (line.startsWith("#")) {
      const [num, en, short] = line.slice(1).split(" ");
      day = { num: +num, en, short, slug: en.toLowerCase() };
      DAYS.push(day); continue;
    }
    const [code, rawTitle, time, spk, slug, trackHint] = line.split("|");
    const [s, e] = time.split("-");
    const kind = kindOf(code, rawTitle);
    const title = cleanTitle(rawTitle);
    const track = trackHint || (code === "-" ? "L3" : code.slice(0, 2));
    const shownCode = code === "-" ? "" : code.replace(/-2$/, "");
    const id = day.num + ":" + (code === "-" ? slug : code);
    SESSIONS.push({
      id, day: day.num, code: shownCode, title, kind, track,
      start: toMin(s), end: toMin(e),
      speakers: spk || "", room: "",
      url: slug ? BASE + day.slug + "/" + slug + ".aspx" : "",
    });
  }
})();

// Übernimmt neue Daten aus data/sessions.json (Räume, Zeiten, Titel, neue/entfallene Punkte).

const titleWords = x => new Set((x || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 2));
function sameTopic(a, b) {
  const A = titleWords(a), B = titleWords(b); if (!A.size || !B.size) return false;
  let n = 0; for (const w of A) if (B.has(w)) n++;
  return n / Math.min(A.size, B.size) >= 0.5;
}
function descOf(s) {

  if (!d || !d.summary || d.summary === "-") return null;
  return sameTopic(d.title || s.baseTitle || s.title, s.title) ? d : null;
}
function applyUpdates(data) {
  const ch = { codes: [], rooms: [], times: [], titles: [], speakers: [], added: [], removed: [] };
  if (!data || !Array.isArray(data.sessions)) return ch;
  const byUrl = new Map(SESSIONS.filter(s => s.url).map(s => [s.url.toLowerCase(), s]));
  const seen = new Set();
  const items = data.sessions.filter(n => n && n.url && n.start != null && n.end != null);
  const newUrls = new Set(items.map(n => n.url.toLowerCase()));
  // Umnummerierung: neue Adresse, aber gleicher Titel (oder gleiche Sprecher und Zeit, oder gleiche Nummer und Zeit) wie eine Session,
  // deren alte Adresse verschwunden ist. Die Session behält ihre id, damit Merkliste und Markierungen bleiben.
  const norm = x => (x || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const orphans = SESSIONS.filter(s => s.url && !newUrls.has(s.url.toLowerCase()));
  const fresh = items.filter(n => !byUrl.has(n.url.toLowerCase()));
  const renum = new Map();
  // Stärkste Übereinstimmung zuerst über alle Kandidaten: Titel, dann Sprecher + Zeit, dann Nummer + Zeit
  for (const same of [
    (s, n) => norm(s.title) === norm(cleanTitle(n.title || "")),
    (s, n) => { const sp = norm((n.speakers || []).join(", ")); return sp && norm(s.speakers) === sp && s.start === n.start && s.end === n.end; },
    (s, n) => n.code && s.code === n.code && s.start === n.start,
  ]) for (const n of fresh) {

  const pairs = [];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) if (clash(list[i], list[j])) pairs.push([list[i], list[j]]);
  return pairs;
}

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

// Die 25 häufigsten Begriffe aus den Session-Titeln (jede Session zählt einmal), Füllwörter ausgenommen
const STOP = new Set(("a an and are as at be beyond build building by can day did do does don't for from get go guide how i in into is it its keynote lab live make "
  + "minutes my new not of on or our panel discussion practical real really smarter that the their them this to up use using vs we what when where who why will with "
  + "without workshop you your actually reality world tips tricks introduction mastering modern next part one two three way ways need know developer developers development app apps application applications platform feature features securing professionals team dev hero success designing").split(" "));
function topTerms(n = 25) {
  const list = SESSIONS.filter(s => s.kind !== "Event" && !s.removed && !/^to be announced/i.test(s.title));
  const words = new Map(), pairs = new Map();
  const add = (m, k, form) => { const e = m.get(k) || { n: 0, forms: new Map() }; e.n++; e.forms.set(form, (e.forms.get(form) || 0) + 1); m.set(k, e); };
  for (const s of list) {
    const toks = (s.title.match(/\.?[A-Za-z][A-Za-z0-9#+.]*[A-Za-z0-9#+]|[A-Za-z]{2,}/g) || []).filter(w => !STOP.has(w.toLowerCase()));
    const seen = new Set(), seenP = new Set();
    toks.forEach((w, i) => {
      const k = w.toLowerCase().replace(/(?<=..[^s])s$/, "");
      if (!seen.has(k)) { seen.add(k); add(words, k, w); }
      const nx = toks[i + 1];
      if (nx) { const pk = k + " " + nx.toLowerCase().replace(/(?<=..[^s])s$/, ""); if (!seenP.has(pk)) { seenP.add(pk); add(pairs, pk, w + " " + nx); } }
    });
  }
  // Feste Wortpaare (z. B. "SQL Server", "Active Directory") ersetzen ihre Einzelwörter
  for (const [pk, e] of pairs) {
    if (e.n < 3) continue;
    const [a, b] = pk.split(" ");
    const wa = words.get(a), wb = words.get(b);
    if (!wa || !wb || (e.n < 0.6 * wa.n && e.n < 0.6 * wb.n)) continue;
    wa.n -= e.n; wb.n -= e.n;
    words.set(pk, e);
  }
  const label = e => [...e.forms].sort((x, y) => y[1] - x[1])[0][0].replace(/^NET$/, ".NET");
  return [...words.values()].filter(e => e.n >= 2).sort((a, b) => b.n - a.n).slice(0, n).map(e => ({ term: label(e), n: e.n }));
}
function renderTopics() {
  const terms = topTerms(), open = state.topicsOpen, shown = open ? terms : terms.slice(0, 10);
  const q = state.q.trim().toLowerCase();
  $("#topics").innerHTML = `<span class="label">${t("topics")}</span>` + shown.map(x =>
    `<button class="chip topic" data-topic="${esc(x.term)}" aria-pressed="${q === x.term.toLowerCase()}">${esc(x.term)}<small>${x.n}</small></button>`).join("")
    + (terms.length > 10 ? `<button class="link-btn" data-topics-more>${open ? t("fewer") : t("moreN", terms.length - 10)}</button>` : "");
}

function renderSlotSelect() {
  const starts = [...new Set(SESSIONS.filter(s => s.day === state.day).map(s => s.start))].sort((a, b) => a - b);

function nopeBtn(s) {
  if (s.kind === "Event") return "";
  const on = nope.has(s.id), m = must.has(s.id);
  return `<button class="must-btn" data-must="${s.id}" aria-pressed="${m}" title="${t(m ? "mustUndo" : "mustSet")}" aria-label="${t(m ? "mustUndo" : "mustSet")}">!</button><button class="nope-btn" data-nope="${s.id}" aria-pressed="${on}" title="${t(on ? "nopeUndo" : "nopeSet")}" aria-label="${t(on ? "nopeUndo" : "nopeSet")}">${on ? t("nopeUndoShort") : "✕"}</button>`;
}
function cardHTML(s, opts = {}) {
  const tr = TRACKS[s.track];
  const isPicked = picked.has(s.id);
  const conf = isPicked ? conflictsOf(s) : [];
  const wouldConf = !isPicked ? conflictsOf(s) : [];
  const cls = ["card", s.kind === "Event" ? "event" : "", s.removed ? "gone" : "", isPicked ? "picked" : "", conf.length ? "conflict" : "", opts.only ? "only" : "", nope.has(s.id) ? "nope" : "", must.has(s.id) ? "must" : "", isPicked && !conf.length && decidedBy(s).length ? "decided" : ""].join(" ");
  const titleHTML = `<button class="ttl" data-info="${s.id}">${esc(s.title)}</button>`;
  let warn = "";
  if (conf.length) warn = `<button class="warn-text conf-link" data-conf="${[s, ...conf].map(c => c.id).join(",")}">${t("overlapWith", conf.map(c => esc(c.code || c.title.slice(0, 24) + "…")).join(", "))} →</button>`;
  else if (isPicked && decidedBy(s).length) warn = `<button class="warn-text decided conf-link" data-conf="${overlapGroup(s).map(c => c.id).join(",")}">${t("decidedFor", decidedBy(s).map(c => esc(c.code || c.title.slice(0, 24) + "…")).join(", "))} →</button>`;
  else if (isPicked && must.has(s.id) && overlapGroup(s).length > 1) warn = `<button class="warn-text decided conf-link" data-conf="${overlapGroup(s).map(c => c.id).join(",")}">${t("chosenOver", overlapGroup(s).slice(1).map(c => esc(c.code || c.title.slice(0, 24) + "…")).join(", "))} →</button>`;
  else if (wouldConf.length && !opts.plan) warn = `<span class="warn-text" style="color:var(--muted);font-weight:500">${t("collidesSel")}</span>`;
  return `<article class="${cls}" style="--c: var(${tr.c})">
    <div class="meta">${s.code ? `<span class="code">${s.code}</span>` : ""}<span class="tag">${KIND_LABEL[s.kind]}</span>${opts.only ? `<span class="tag only">${t("onlyOpt")}</span>` : ""}${nope.has(s.id) ? `<span class="tag">${t("nopeTag")}</span>` : ""}${must.has(s.id) ? `<span class="tag must">${t("mustTag")}</span>` : ""}${chgTags(s)}${s.removed ? `<span class="tag gone">${t("removedTag")}</span>` : ""}<span>${tr.short}</span>${opts.plan ? "" : `<span class="dur">· ${durText(s.end - s.start)}</span>`}${s.room ? `<span class="room">${esc(s.room)}</span>` : ""}</div>
    <h3>${titleHTML}</h3>
    ${s.speakers || opts.cmp ? `<div class="spk">${spkLinks(s)}</div>` : ""}
    ${opts.desc ? descHTML(s) : ""}
    <div class="card-foot">${warn}<span class="foot-btns">${nopeBtn(s)}<button class="pick" data-pick="${s.id}" aria-pressed="${isPicked}">${isPicked ? STAR + t("picked") : PLUS + t("pick")}</button></span></div>
  </article>`;
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  // Treffer am Wortanfang, damit z. B. "AI" nicht in "maintain" gefunden wird
  const qre = new RegExp("(^|[^a-z0-9])" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  // Mit Suchbegriff oder "Nur geänderte": über alle Tage
  const all = q || state.onlyChanged || state.allDays;
  return SESSIONS.filter(s => (all || s.day === state.day)
    && (all || !state.slot || s.start === +state.slot)
    && (!state.onlyChanged || isChanged(s))
    && (!state.kind || s.kind === state.kind)
    && (!state.tracks.length || state.tracks.includes(s.track))
    && (!state.onlyPicked || picked.has(s.id))
    && (!s.removed || picked.has(s.id) || state.onlyChanged)
    && (!state.hideEvents || s.kind !== "Event")
    && (state.showNope || !nope.has(s.id))
    && (!state.onlyMust || must.has(s.id))
    && (!q || (s.title + " " + s.speakers + " " + s.code + " " + TRACKS[s.track].name + " " + (s.room || "") + " " + ((descOf(s) || {}).summary || "") + " " + ((descOf(s) || {}).learn || "")).toLowerCase().search(qre) >= 0));
}

function renderFold() {
  const n = (state.slot ? 1 : 0) + (state.kind ? 1 : 0) + state.tracks.length + ["onlyPicked", "hideEvents", "onlyMust", "onlyChanged", "showNope"].filter(k => state[k]).length;
  $("#more-filters").hidden = !state.filtersOpen;
  $("#fold").setAttribute("aria-expanded", state.filtersOpen);
  $("#fold-n").textContent = n ? n : "";
}
function renderProgram() {
  renderFold();
  renderTopics();
  const list = filtered();
  $("#nope-count").textContent = nope.size ? ` (${nope.size})` : "";
  $("#must-count").textContent = must.size ? ` (${must.size})` : "";
  const nChg = Object.keys(changed).filter(id => BY_ID[id]).length;
  $("#chg-chip").hidden = !nChg && !state.onlyChanged;
  $("#chg-count").textContent = nChg ? ` (${nChg})` : "";
  const global = !!state.q.trim() || state.onlyChanged || !!state.allDays;
  $("#slot").disabled = global;
  const pairs = global ? [] : conflictPairs(state.day);
  $("#day-banner").innerHTML = state.onlyChanged ? `<div class="search-note">${t("chgNote", list.length)} · <button class="link-btn" data-chg-seen>${t("chgSeen")}</button></div>` : state.q.trim() ? `<div class="search-note">${t("searchAll", list.length, new Set(list.map(s => s.day)).size)}</div>` : global ? `<div class="search-note">${t("allDaysNote", list.length, new Set(list.map(s => s.day)).size)}</div>` : pairs.length ? `<div class="banner"><span><b>${t("overlaps", pairs.length)}</b> ${t("onThisDay")}: ${pairs.map(([a, b]) => `<button class="conf-link" data-conf="${a.id},${b.id}">${esc(a.code || a.title)} ↔ ${esc(b.code || b.title)}</button>`).join(" · ")}</span></div>` : "";
  if (!list.length) {
    $("#list").innerHTML = `<div class="empty"><h2>${t("noHits")}</h2><p>${t(global ? "noHitsAll" : "noHitsText")}</p></div>`;
    return;
  }
  const groups = new Map();
  for (const s of list) { const k = s.day * 10000 + s.start; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }
  const order = { Keynote: 0, Panel: 1, Workshop: 2, Lab: 2, Session: 3, "Fast Focus": 3, Event: 4 };
  const trackOrder = Object.keys(TRACKS);
  let lastDay = null;
  $("#list").innerHTML = [...groups.entries()].sort((a, b) => a[0] - b[0]).map(([k, items]) => {
    const day = Math.floor(k / 10000), start = k % 10000;
    const head = global && day !== lastDay ? `<h2 class="day-head" data-dayhead="${day}">${DAY_NAME[day]}, ${t("dateLong", day)}</h2>` : "";
    lastDay = day;
    items.sort((a, b) => must.has(b.id) - must.has(a.id) || order[a.kind] - order[b.kind] || trackOrder.indexOf(a.track) - trackOrder.indexOf(b.track) || a.code.localeCompare(b.code));
    const ends = [...new Set(items.map(i => i.end))];
    const sl = slotAt(day, start);
    return `${head}<section class="slot"><div class="slot-time">${fmt(start)}<small>${ends.length === 1 ? t("until", fmt(ends[0])) : t("items", items.length)}</small>${sl && sl.items.length > 1 ? `<button class="slot-link" data-slot="${day}:${start}">${t("compare")}</button>` : ""}</div>
      <div class="cards">${items.map(s => cardHTML(s)).join("")}</div></section>`;
  }).join("");
}

function renderPlan() {
  const all = [...picked].map(id => BY_ID[id]);
  const pairs = conflictPairs(null);
  const minutes = contentMinutes(all);
  $("#stats").innerHTML = `<span><b>${all.length}</b>${t("statPicked")}</span><span><b>${(minutes / 60).toLocaleString(t("decimal"), { maximumFractionDigits: 1 })}</b>${t("statHours")}</span><span class="${pairs.length ? "bad" : ""}"><b>${pairs.length}</b>${t("statOverlaps", pairs.length)}</span>`;
  if (!all.length) {
    $("#plan-list").innerHTML = `<div class="empty"><h2>${t("emptyPlan")}</h2><p>${t("emptyPlanText")}</p><button class="btn primary" data-go="prog">${t("toProgram")}</button></div>`;
    return;
  }
  $("#plan-list").innerHTML = DAYS.map(d => {
    const mine = all.filter(s => s.day === d.num);
    const dp = conflictPairs(d.num);
    // Zeilen: jeder Slot des Tages, plus gemerkte Pausen/Events
    const rows = SLOTS[d.num].map(sl => ({ t: sl.start, sl }));
    mine.filter(s => s.kind === "Event").forEach(s => rows.push({ t: s.start, ev: s }));
    rows.sort((a, b) => a.t - b.t || (a.ev ? 1 : -1));
    const freeCount = SLOTS[d.num].filter(sl => !mine.some(s => s.kind !== "Event" && s.start < sl.end && sl.start < s.end)).length;
    const free = state.onlyFree;
    const html = rows.map(r => {
      if (r.ev && free) return "";
      if (r.ev) return `<div class="tl-item"><div class="tl-time">${fmt(r.ev.start)}<small>${t("until", fmt(r.ev.end))}</small></div>${cardHTML(r.ev, { plan: true })}</div>`;
      const sl = r.sl;
      const here = mine.filter(s => s.kind !== "Event" && s.start === sl.start);
      const cover = mine.filter(s => s.kind !== "Event" && s.start !== sl.start && s.start < sl.end && sl.start < s.end);
      const opts = sl.items.filter(s => !nope.has(s.id));
      const time = `<div class="tl-time">${fmt(sl.start)}<small>${t("until", fmt(sl.end))}</small>${opts.length > 1 ? `<button class="slot-link" data-slot="${d.num}:${sl.start}">${t("options", opts.length)}</button>` : ""}</div>`;
      if (free && (here.length || cover.length)) return "";
      if (here.length) return here.map((s, i) => `<div class="tl-item">${i ? "<div></div>" : time}${cardHTML(s, { plan: true })}</div>`).join("");
      if (cover.length) return `<div class="tl-item">${time}<div class="covered">${t("coveredBy", cover.map(c => esc(c.code || c.title)).join(", "))}</div></div>`;
      if (opts.length === 1) return `<div class="tl-item">${time}${cardHTML(opts[0], { plan: true, only: true })}</div>`;
      return `<div class="tl-item">${time}<button class="slot-empty" data-slot="${d.num}:${sl.start}"><span><b>${t("free")}</b><br>${opts.length ? t("choices", opts.length) : t("noneLeft")}${opts.some(s => must.has(s.id)) ? `<br><span class="must-note">! ${t("mustTag")}: ${opts.filter(s => must.has(s.id)).map(s => esc(s.code || s.title)).join(", ")}</span>` : ""}</span><span class="go">${t("look")}</span></button></div>`;
    }).join("");
    return `<section class="plan-day${mine.length ? "" : " no-pick"}"><h2>${DAY_NAME[d.num]}, ${t("dateLong", d.num)} <small>${t("dayStats", mine.length, freeCount)}${dp.length ? ` · <button class="conf-link" style="color:var(--danger)" data-conf="${[...new Set(dp.flat().map(x => x.id))].join(",")}">${t("overlaps", dp.length)} →</button>` : ""}</small></h2><div class="tl">${html || `<div class="covered">${t("allFilled")}</div>`}</div></section>`;
  }).join("");
}

function descHTML(s) {
  const d = descOf(s);
  if (!d || !d.summary || d.summary === "-") return `<div class="cdesc"><div class="lvl"></div><p style="color:var(--muted)">${s.kind === "Event" ? t("noDescEvent") : t("noDesc")}</p><ul></ul></div>`;
  const learn = d.learn && d.learn !== "-" ? d.learn.split(/\s*;\s*/).filter(Boolean) : [];
  return `<div class="cdesc"><div class="lvl">${d.level && d.level !== "-" ? esc(d.level) : ""}</div><p>${esc(d.summary)}</p><ul>${learn.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
}
function renderCompare() {
  const conflict = (state.cmpIds || []).map(id => BY_ID[id]).filter(Boolean);
  if (conflict.length) return renderConflict(conflict);
  $("#cmp-prev").hidden = $("#cmp-next").hidden = false;
  const list = SLOTS[state.cmpDay];
  let idx = list.findIndex(x => x.start === state.cmpStart);
  if (idx < 0) { idx = 0; state.cmpStart = list[0].start; }
  const sl = list[idx];
  const trackOrder = Object.keys(TRACKS);
  const hiddenN = state.showNope ? 0 : sl.items.filter(s => nope.has(s.id)).length;
  const items = sl.items.filter(s => state.showNope || !nope.has(s.id)).sort((a, b) => must.has(b.id) - must.has(a.id) || trackOrder.indexOf(a.track) - trackOrder.indexOf(b.track) || a.code.localeCompare(b.code));
  const ends = [...new Set(items.map(i => i.end))].sort((a, b) => a - b);
  $("#cmp-title").innerHTML = `${DAY_NAME[sl.day]}, ${t("dateShort", sl.day)} · ${fmt(sl.start)}<small>${t("nItems", items.length)} · ${t("ends", ends.map(fmt).join(" / "))}</small>`;
  const mineHere = items.filter(s => picked.has(s.id));
  const blockers = [...picked].map(id => BY_ID[id]).filter(o => !sl.items.includes(o) && o.day === sl.day && o.start < sl.end && sl.start < o.end);
  $("#cmp-status").innerHTML = mineHere.length ? `${t("pickedHere")} <b>${mineHere.map(s => esc(s.code || s.title)).join(", ")}</b>${mineHere.length > 1 ? ` <span style="color:var(--danger)">${t("overlapParen")}</span>` : ""}`
    : blockers.length ? t("blockedBy", blockers.map(b => esc(b.code || b.title)).join(", ")) : t("nothingHere");
  if (hiddenN) $("#cmp-status").innerHTML += ` <button class="link-btn" data-shownope>${t("nopeHidden", hiddenN)}</button>`;
  $("#cmp-list").className = "compare" + (items.length > 4 ? " many" : "");
  const desc = state.cmpMode === "desc";
  $("#cmp-titles").setAttribute("aria-pressed", !desc); $("#cmp-desc").setAttribute("aria-pressed", desc);
  if (desc) $("#cmp-list").classList.add("desc");
  $("#cmp-list").innerHTML = items.map(s => cardHTML(s, { cmp: true, desc })).join("");
  $("#cmp-prev").disabled = idx === 0;
  $("#cmp-next").disabled = idx === list.length - 1;
}

// Vergleich der sich überschneidenden Sessions (aus einer roten Überschneidungs-Zeile)
function renderConflict(items) {
  items = [...items].sort((a, b) => a.start - b.start || a.code.localeCompare(b.code));
  const from = Math.min(...items.map(s => s.start)), to = Math.max(...items.map(s => s.end));
  $("#cmp-title").innerHTML = `${DAY_NAME[items[0].day]}, ${t("dateShort", items[0].day)} · ${fmt(from)}–${fmt(to)}<small>${t("cmpConflictTitle", items.length)}</small>`;
  const left = items.filter(s => picked.has(s.id));
  const still = left.some((a, i) => left.some((b, j) => j > i && clash(a, b)));
  const chosen = left.filter(s => must.has(s.id));
  $("#cmp-status").innerHTML = still ? `<span style="color:var(--danger)">${t("cmpConflictHint")}</span>` : chosen.length ? `<span style="color:var(--must)">${t("decidedFor", chosen.map(s => esc(s.code || s.title)).join(", "))}</span>` : t("cmpConflictDone");
  const desc = state.cmpMode === "desc";
  $("#cmp-titles").setAttribute("aria-pressed", !desc); $("#cmp-desc").setAttribute("aria-pressed", desc);
  $("#cmp-list").className = "compare" + (items.length > 4 ? " many" : "") + (desc ? " desc" : "");
  $("#cmp-list").innerHTML = items.map(s => cardHTML(s, { cmp: true, desc })).join("");
  $("#cmp-prev").hidden = $("#cmp-next").hidden = true;
}

function render() {
  if (state.view === "cmp" && state.cmpStart == null && !(state.cmpIds || []).length) state.view = "prog";
  const base = state.view === "cmp" ? state.back : state.view;
  $("#v-prog").setAttribute("aria-pressed", base === "prog");
  $("#v-plan").setAttribute("aria-pressed", base === "plan");
  $("#v-spk").setAttribute("aria-pressed", base === "spk");
  $("#spk").hidden = state.view !== "spk";
  $("#prog").hidden = state.view !== "prog";
  $("#plan").hidden = state.view !== "plan";
  $("#cmp").hidden = state.view !== "cmp";
  $("#days").hidden = state.view !== "prog";
  renderDays();
  if (state.view === "prog") { renderSlotSelect(); renderProgram(); }
  else if (state.view === "plan") renderPlan();
  else if (state.view === "spk") renderSpeakers();
  else renderCompare();
}

function planText() {
  return DAYS.map(d => {

  if (!popStack.length) return;
  const b = document.createElement("button");
  b.className = "link-btn pop-back"; b.id = "pop-back";
  b.textContent = t("popBack", popName(popStack[popStack.length - 1]));
  $("#pop").prepend(b);
}
function closeInfo() { popStack.length = 0; $("#pop-bg").hidden = true; document.body.classList.remove("noscroll"); const id = openInfo.current; openInfo.current = null; const b = id && document.querySelector(`[data-info="${CSS.escape(id)}"]`); if (b) b.focus(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#pop-bg").hidden) closeInfo(); });

// Zurück-Geste des Handys: jedes offene Popup und jeder Schritt darin bekommt einen Verlaufseintrag
const popHist = { depth: 0, skip: 0, push() { try { history.pushState({ pop: ++this.depth }, ""); } catch {} } };
new MutationObserver(() => {
  const open = !$("#pop-bg").hidden;
  if (open && !popHist.depth) popHist.push();
  else if (!open && popHist.depth) { popHist.skip++; history.go(-popHist.depth); popHist.depth = 0; }
}).observe($("#pop-bg"), { attributes: true, attributeFilter: ["hidden"] });
window.addEventListener("popstate", () => {
  if (popHist.skip) { popHist.skip--; return; }
  if ($("#pop-bg").hidden || !popHist.depth) return;
  popHist.depth--;
  if (popStack.length && popHist.depth) openInfo(popStack.pop());
  else { popHist.depth = 0; closeInfo(); }
});

// Ereignisse
document.addEventListener("click", e => {
  if (e.target.id === "pop-bg" || e.target.closest("#pop-x")) { closeInfo(); return; }
  if (e.target.closest("#pop-back")) { if (popHist.depth > 1) history.back(); else openInfo(popStack.pop()); return; }
  // Aus dem Popup heraus weiter zu Session oder Sprecher: aktuelle Ansicht für "Zurück" merken
  const nav = e.target.closest("#pop [data-info], #pop [data-speaker]");
  if (nav && openInfo.current) { const to = nav.dataset.info || "spk:" + nav.dataset.speaker; if (to !== openInfo.current) { popStack.push(openInfo.current); popHist.push(); } }
  const info = e.target.closest("[data-info]");
  if (info) { openInfo(info.dataset.info); return; }
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const id = pick.dataset.pick;
    if (picked.has(id)) { picked.delete(id); toast(t("removed")); }
    else { picked.add(id); nope.delete(id); const c = conflictsOf(BY_ID[id]); toast(c.length ? t("pickedOverlap", c[0].code || c[0].title) : t("picked")); }
    savePicked(); render(); if (openInfo.current) openInfo(openInfo.current); return;
  }
  const spkEl = e.target.closest("[data-speaker]");
  if (spkEl) { openSpeaker(spkEl.dataset.speaker); return; }
  const topic = e.target.closest("[data-topic]");
  if (topic) { const v = topic.dataset.topic; state.q = state.q.trim().toLowerCase() === v.toLowerCase() ? "" : v; syncInputs(); saveUI(); renderProgram(); return; }
  if (e.target.closest("[data-topics-more]")) { state.topicsOpen = !state.topicsOpen; saveUI(); renderTopics(); return; }
  const mustEl = e.target.closest("[data-must]");
  if (mustEl) {
    const id = mustEl.dataset.must;
    if (must.has(id)) { must.delete(id); toast(t("mustOff")); }
    else { must.add(id); nope.delete(id); toast(t("mustOn")); }
    savePicked(); render(); if (openInfo.current) openInfo(openInfo.current); return;
  }
  const nopeEl = e.target.closest("[data-nope]");
  if (nopeEl) {
    const id = nopeEl.dataset.nope;
    if (nope.has(id)) { nope.delete(id); toast(t("nopeOff")); }
    else { nope.add(id); picked.delete(id); must.delete(id); toast(t("nopeOn")); }
    savePicked(); render(); if (openInfo.current) openInfo(openInfo.current); return;
  }
  if (e.target.closest("[data-shownope]")) { state.showNope = true; syncInputs(); saveUI(); render(); return; }
  const confBtn = e.target.closest("[data-conf]");
  if (confBtn) {
    const ids = confBtn.dataset.conf.split(",").filter(id => BY_ID[id]);
    if (state.view !== "cmp") rememberAnchor(confBtn);
    if (openInfo.current) closeInfo();
    state.back = state.view === "cmp" ? state.back : state.view;
    Object.assign(state, { view: "cmp", cmpIds: ids, cmpDay: BY_ID[ids[0]].day }); saveUI(); render(); window.scrollTo(0, 0); return;
  }
  const slotBtn = e.target.closest("[data-slot]");
  if (slotBtn) {
    const [d, st] = slotBtn.dataset.slot.split(":").map(Number);
    if (state.view !== "cmp") rememberAnchor(slotBtn);
    state.back = state.view === "cmp" ? state.back : state.view;
    Object.assign(state, { view: "cmp", cmpDay: d, cmpStart: st, cmpIds: null }); saveUI(); render(); window.scrollTo(0, 0); return;
  }
  if (e.target.closest("[data-chg-seen]")) { clearChanges(); toast(t("chgCleared")); return; }
  if (e.target.closest("[data-chg-show]")) { closeInfo(); state.view = "prog"; state.onlyChanged = true; syncInputs(); saveUI(); render(); window.scrollTo(0, 0); return; }
  const day = e.target.closest("[data-day]");
  if (day) {
    if (day.dataset.day === "all") { state.allDays = true; state.slot = ""; saveUI(); render(); window.scrollTo(0, 0); return; }
    state.day = +day.dataset.day; state.slot = ""; state.allDays = false; saveUI(); render();
    // Bei aktiver Suche (über alle Tage) zum Tag in den Treffern springen
    if (state.q.trim() || state.onlyChanged) {
      const h = $(`#list .day-head[data-dayhead="${state.day}"]`);
      if (h) window.scrollTo(0, window.scrollY + h.getBoundingClientRect().top - $("header.top").getBoundingClientRect().bottom - 8);
      else toast(t("noHitsDay", DAY_NAME[state.day]));
    } else window.scrollTo(0, 0);
    return;
  }
  const tr = e.target.closest("[data-track]");
  if (tr) { const k = tr.dataset.track; state.tracks = state.tracks.includes(k) ? state.tracks.filter(x => x !== k) : [...state.tracks, k]; saveUI(); renderTrackChips(); render(); return; }
  const go = e.target.closest("[data-go]");
  if (go) { state.view = go.dataset.go; saveUI(); render(); }
});
$("#v-prog").onclick = () => { state.view = "prog"; saveUI(); render(); };
$("#v-plan").onclick = () => { state.view = "plan"; saveUI(); render(); window.scrollTo(0, 0); };
$("#v-spk").onclick = () => { state.view = "spk"; saveUI(); render(); window.scrollTo(0, 0); };
$("#spk-q").oninput = () => renderSpeakers();
$("#cmp-back").onclick = () => { state.view = state.back || "plan"; state.cmpIds = null; saveUI(); render(); restoreAnchor(); };

// Rücksprung an die Stelle, von der aus der Vergleich geöffnet wurde
let anchor = null;
function rememberAnchor(el) {
  // Bezugspunkt, der nach dem Neuzeichnen wiederzufinden ist: Session-Titel, Slot-Knopf oder Tagesüberschrift
  const card = el.closest(".card"), day = el.closest(".plan-day");
  const id = openInfo.current || (card && card.querySelector("[data-info]") || {}).dataset?.info;
  const sel = id ? `[data-info="${CSS.escape(id)}"]` : el.dataset.slot ? `[data-slot="${CSS.escape(el.dataset.slot)}"]` : null;
  const ref = (sel && [...document.querySelectorAll(sel)].find(x => x.offsetParent)) || (day && day.querySelector("h2")) || el;
  anchor = { y: window.scrollY, sel, day: day ? day.querySelector("h2").firstChild.textContent : null, top: ref.getBoundingClientRect().top };
}
function restoreAnchor() {
  if (!anchor) return;
  const a = anchor; anchor = null;
  const view = state.view === "plan" ? $("#plan") : $("#prog");
  let el = a.sel && [...view.querySelectorAll(a.sel)].find(x => x.offsetParent);
  if (!el && a.day) el = [...view.querySelectorAll(".plan-day h2")].find(h => h.firstChild.textContent === a.day);
  if (el) window.scrollTo(0, window.scrollY + el.getBoundingClientRect().top - a.top);
  else window.scrollTo(0, a.y);
}
function stepSlot(dir) {
  const list = SLOTS[state.cmpDay]; const i = list.findIndex(x => x.start === state.cmpStart) + dir;
  if (list[i]) { state.cmpStart = list[i].start; saveUI(); render(); }
}
$("#cmp-titles").onclick = () => { state.cmpMode = "titles"; saveUI(); render(); };
$("#cmp-desc").onclick = () => { state.cmpMode = "desc"; saveUI(); render(); };
$("#cmp-prev").onclick = () => stepSlot(-1);
$("#cmp-next").onclick = () => stepSlot(1);
$("#q").oninput = e => { state.q = e.target.value; saveUI(); renderProgram(); };
$("#slot").onchange = e => { state.slot = e.target.value; saveUI(); renderProgram(); };
$("#kind").onchange = e => { state.kind = e.target.value; saveUI(); renderProgram(); };
$("#only-picked").onchange = e => { state.onlyPicked = e.target.checked; saveUI(); renderProgram(); };
$("#hide-events").onchange = e => { state.hideEvents = e.target.checked; saveUI(); renderProgram(); };
$("#only-free").onchange = e => { state.onlyFree = e.target.checked; saveUI(); renderPlan(); };
$("#only-must").onchange = e => { state.onlyMust = e.target.checked; saveUI(); renderProgram(); };
$("#fold").onclick = () => { state.filtersOpen = !state.filtersOpen; saveUI(); renderFold(); };
$("#only-changed").onchange = e => { state.onlyChanged = e.target.checked; saveUI(); renderProgram(); window.scrollTo(0, 0); };
$("#show-nope").onchange = e => { state.showNope = e.target.checked; saveUI(); renderProgram(); };
$("#reset").onclick = () => { Object.assign(state, { q: "", slot: "", kind: "", tracks: [], onlyPicked: false, hideEvents: false, showNope: false, onlyMust: false, onlyChanged: false }); syncInputs(); saveUI(); renderTrackChips(); render(); };
$("#clear").onclick = () => { $("#clear-confirm").hidden = false; };
$("#clear-no").onclick = () => { $("#clear-confirm").hidden = true; };
$("#clear-yes").onclick = () => { picked.clear(); savePicked(); $("#clear-confirm").hidden = true; toast(t("cleared")); render(); };
$("#copy").onclick = () => {
  const text = planText() || t("nothingYet");
  const fallback = () => { $("#copy-fallback").hidden = false; const ta = $("#copy-text"); ta.value = text; ta.focus(); ta.select(); toast(t("selectCopy")); };
  try { navigator.clipboard.writeText(text).then(() => toast(t("copied")), fallback); } catch { fallback(); }
};
function syncInputs() {
  $("#q").value = state.q; $("#kind").value = state.kind;
  $("#only-picked").checked = state.onlyPicked; $("#hide-events").checked = state.hideEvents; $("#show-nope").checked = !!state.showNope; $("#only-must").checked = !!state.onlyMust; $("#only-changed").checked = !!state.onlyChanged; $("#only-free").checked = !!state.onlyFree;
}
$("#lang-de").onclick = () => setLang("de");
$("#lang-en").onclick = () => setLang("en");
applyLang(); syncInputs(); renderTrackChips(); render();
</script>
