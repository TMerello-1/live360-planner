name: Update session data

on:
  schedule:
    - cron: "17 6 * * *"   # täglich 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sessions
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the official session list
        run: python3 scripts/scrape.py
      - name: Read the official speaker list
        run: python3 scripts/scrape_speakers.py
        continue-on-error: true
      - name: Commit changes
        run: |
          git add -N data/ 2>/dev/null || true
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update session and speaker data from live360events.com"
          git push
