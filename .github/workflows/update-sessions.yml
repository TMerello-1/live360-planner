name: Update session data

on:
  schedule:
    - cron: "17 6 * * *"   # täglich 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sessions
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the official session and speaker lists of every active conference
        run: |
          status=0
          for cfg in conferences/*/config.json; do
            id=$(basename "$(dirname "$cfg")")
            python3 -c "import json,sys; sys.exit(0 if json.load(open('$cfg')).get('active') else 1)" || continue
            echo "::group::$id"
            python3 scripts/scrape.py "$id" || status=1
            python3 scripts/scrape_speakers.py "$id" || echo "::warning::speaker list for $id failed"
            echo "::endgroup::"
          done
          exit $status
      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git add -N data/ 2>/dev/null || true
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update session and speaker data from live360events.com"
          git push
