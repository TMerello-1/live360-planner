name: San Diego probe (temporary)
on:
  push:
    branches: [sd-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .probe/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe/
